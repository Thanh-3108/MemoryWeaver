      function snapWallFixture(item, rw, rd, rh) {
        const halfW = rw / 2;
        const halfD = rd / 2;
        const itemW = item.width || 0.8;
        const itemD = item.depth || 0.2;
        const span = (item.kind === 'window' || item.kind === 'curtain' || item.kind === 'projector_screen' || item.kind === 'whiteboard' || item.kind === 'blackboard')
          ? Math.max(itemW, itemD, 2.0)
          : itemW;
        const cornerMargin = Math.max(0.25, (span / 2) + 0.15);

        const dLeft = Math.abs(item.x - (-halfW));
        const dRight = Math.abs(item.x - halfW);
        const dBack = Math.abs(item.z - halfD);
        const dFront = Math.abs(item.z - (-halfD));
        const minDist = Math.min(dLeft, dRight, dBack, dFront);

        let wallSide = 'back';
        let posX = item.x;
        let posZ = item.z;
        let yaw = 0;

        if (minDist === dRight) {
          wallSide = 'right';
          posX = halfW - 0.04;
          posZ = (-halfD + cornerMargin <= halfD - cornerMargin)
            ? Math.max(-halfD + cornerMargin, Math.min(halfD - cornerMargin, item.z))
            : 0;
          yaw = 90; // hướng vào trong theo trục -X
        } else if (minDist === dLeft) {
          wallSide = 'left';
          posX = -halfW + 0.04;
          posZ = (-halfD + cornerMargin <= halfD - cornerMargin)
            ? Math.max(-halfD + cornerMargin, Math.min(halfD - cornerMargin, item.z))
            : 0;
          yaw = -90; // hướng vào trong theo trục +X
        } else if (minDist === dBack) {
          wallSide = 'back';
          posX = (-halfW + cornerMargin <= halfW - cornerMargin)
            ? Math.max(-halfW + cornerMargin, Math.min(halfW - cornerMargin, item.x))
            : 0;
          posZ = halfD - 0.04;
          yaw = 0; // hướng vào trong theo trục -Z
        } else {
          wallSide = 'front';
          posX = (-halfW + cornerMargin <= halfW - cornerMargin)
            ? Math.max(-halfW + cornerMargin, Math.min(halfW - cornerMargin, item.x))
            : 0;
          posZ = -halfD + 0.04;
          yaw = 180; // hướng vào trong theo trục +Z
        }

        return { posX, posZ, yaw, wallSide };
      }

      // --- THUẬT TOÁN ĐỊNH HƯỚNG VÀ GIẢI QUYẾT VA CHẠM BÀN - GHẾ (CHAIR-TABLE DOCKING & CLEARANCE SOLVER) ---
      function resolveChairTableInteractions(resolvedList) {
        if (!Array.isArray(resolvedList)) return;
        const tables = resolvedList.filter(r => r.item.kind === 'table' || r.item.kind === 'desk');
        const chairs = resolvedList.filter(r => r.item.kind === 'chair');

        chairs.forEach(chair => {
          let bestParent = null;
          let minDist = Infinity;

          tables.forEach(parent => {
            const dist = Math.hypot(parent.posX - chair.posX, parent.posZ - chair.posZ);
            if (dist < minDist) {
              minDist = dist;
              bestParent = parent;
            }
          });

          if (!bestParent) return;

          const tw = bestParent.item?.width || 1.6;
          const td = bestParent.item?.depth || 0.8;
          const cw = chair.item?.width || 0.55;
          const cd = chair.item?.depth || 0.55;
          const tyaw = ((bestParent.yaw || 0) * Math.PI) / 180;

          const relX = chair.posX - bestParent.posX;
          const relZ = chair.posZ - bestParent.posZ;
          const cosT = Math.cos(-tyaw);
          const sinT = Math.sin(-tyaw);
          const lx = relX * cosT - relZ * sinT;
          const lz = relX * sinT + relZ * cosT;

          const hw = tw / 2;
          const hd = td / 2;
          const reachW = hw + cd * 0.75;
          const reachD = hd + cd * 0.75;

          // Chỉ can thiệp nếu ghế nằm trong phạm vi tương tác của chiếc bàn này
          if (Math.abs(lx) > reachW || Math.abs(lz) > reachD) {
            return;
          }

          const targetDepthZ = hd + cd * 0.35 - 0.06;
          const targetDepthX = hw + cd * 0.35 - 0.06;
          const isPenetrating = Math.abs(lx) < targetDepthX && Math.abs(lz) < targetDepthZ;

          const normX = Math.abs(lx) / (hw || 1);
          const normZ = Math.abs(lz) / (hd || 1);

          let targetLx = lx;
          let targetLz = lz;

          if (isPenetrating) {
            if (normZ >= normX) {
              const signZ = lz >= 0 ? 1 : -1;
              targetLz = signZ * targetDepthZ;
              targetLx = Math.max(-hw + cw * 0.45, Math.min(hw - cw * 0.45, lx));
            } else {
              const signX = lx >= 0 ? 1 : -1;
              targetLx = signX * targetDepthX;
              targetLz = Math.max(-hd + cw * 0.45, Math.min(hd - cw * 0.45, lz));
            }

            const cosInv = Math.cos(tyaw);
            const sinInv = Math.sin(tyaw);
            chair.posX = bestParent.posX + (targetLx * cosInv - targetLz * sinInv);
            chair.posZ = bestParent.posZ + (targetLx * sinInv + targetLz * cosInv);
          }

          // Kiểm tra và hiệu chỉnh góc quay: Mặt ngồi (-Z) luôn hướng vào bàn, lưng tựa (+Z) quay ra ngoài
          const toTableX = bestParent.posX - chair.posX;
          const toTableZ = bestParent.posZ - chair.posZ;
          const correctFacingYaw = Math.atan2(-toTableX, -toTableZ) * 180 / Math.PI;

          const curYawRad = ((chair.yaw || 0) * Math.PI) / 180;
          const backX = Math.sin(curYawRad);
          const backZ = Math.cos(curYawRad);
          const backFacesTable = (backX * toTableX + backZ * toTableZ) > 0;

          if (isPenetrating || backFacesTable) {
            chair.yaw = correctFacingYaw;
          }
        });
      }

      // --- THUẬT TOÁN ĐỊNH HƯỚNG VÀ TIẾP XÚC THÔNG MINH (SMART ERGONOMIC & ORIENTATION SOLVER) ---
      function solveObjectPlacementAndOrientation(items, rw, rd, rh) {
        if (!Array.isArray(items)) return [];

        const halfW = rw / 2;
        const halfD = rd / 2;

        // B1: Xác định tọa độ sơ bộ của toàn bộ vật thể (kèm snap tường cho đồ gắn tường)
        const resolved = items.map(item => {
          const isWallFixture = ['window', 'door', 'whiteboard', 'blackboard', 'air_conditioner', 'curtain', 'clock', 'picture', 'projector_screen'].includes(item.kind);
          let posX = item.x;
          let posY = typeof item.y === 'number' ? item.y : 0;
          let posZ = item.z;
          let yaw = typeof item.yaw === 'number' ? item.yaw : 0;
          let wallSide = null;

          if (isWallFixture) {
            const snapped = snapWallFixture(item, rw, rd, rh);
            posX = snapped.posX;
            posZ = snapped.posZ;
            yaw = snapped.yaw;
            wallSide = snapped.wallSide;
            if (item.kind === 'window') {
              posY = 0;
            } else if (posY < 0.3) {
              if (item.kind === 'clock') posY = rh * 0.70;
            }
          } else if (item.kind === 'projector') {
            if (posY < 0.3) posY = rh - (item.height || 0.35) - 0.15;
          }

          return {
            item,
            isWallFixture,
            posX,
            posY,
            posZ,
            yaw,
            wallSide
          };
        });

        // B2: Nhận diện các tâm điểm phòng (màn chiếu, bảng dạy học, TV, bàn học, bàn trà)
        const teachingBoard = resolved.find(r => r.item.kind === 'projector_screen' || r.item.kind === 'whiteboard' || r.item.kind === 'blackboard');
        const tvList = resolved.filter(r =>
          r.item.kind === 'television' || r.item.kind === 'tv' ||
          /tivi|ti vi|tv|television|màn hình/i.test((r.item.label || '') + ' ' + (r.item.description || ''))
        );
        const desks = resolved.filter(r => r.item.kind === 'desk');
        const tables = resolved.filter(r => r.item.kind === 'table');
        const supports = resolved.filter(r => ['desk', 'table', 'shelf', 'cabinet', 'chair', 'bed', 'podium'].includes(r.item.kind));

        // B3: Xử lý định hướng bàn học (Desk)
        // Nếu trong lớp học có bảng dạy học, mặt trước bàn học (tấm chắn chân +Z) hướng về phía bảng
        desks.forEach(desk => {
          if (teachingBoard) {
            const dx = teachingBoard.posX - desk.posX;
            const dz = teachingBoard.posZ - desk.posZ;
            if (Math.hypot(dx, dz) > 0.5) {
              // Desk front là local +Z, để xoay +Z về hướng (dx, dz):
              desk.yaw = Math.atan2(dx, dz) * 180 / Math.PI;
            }
          }
        });

        // B4: Xử lý ghế ngồi (Chair) - ĐẢM BẢO 100% LUÔN HƯỚNG VÀO BÀN HỌC / BÀN TRÀ & KHÔNG CHÌM VÀO BÀN
        resolveChairTableInteractions(resolved);
        // Với các ghế đứng độc lập xa bàn (dưới 1.1m tới tường)
        resolved.filter(r => r.item.kind === 'chair').forEach(chair => {
          const nearTable = desks.concat(tables).some(p => Math.hypot(p.posX - chair.posX, p.posZ - chair.posZ) < 1.4);
          if (!nearTable) {
            const dLeft = Math.abs(chair.posX - (-halfW));
            const dRight = Math.abs(chair.posX - halfW);
            const dBack = Math.abs(chair.posZ - halfD);
            const dFront = Math.abs(chair.posZ - (-halfD));
            const minWallDist = Math.min(dLeft, dRight, dBack, dFront);
            if (minWallDist < 1.1) {
              if (minWallDist === dBack) chair.yaw = 0;
              else if (minWallDist === dFront) chair.yaw = 180;
              else if (minWallDist === dLeft) chair.yaw = -90;
              else chair.yaw = 90;
            }
          }
        });

        // B5: Xử lý ghế Sofa - ĐẢM BẢO 100% LUÔN HƯỚNG VỀ PHÍA TIVI HOẶC BÀN TRÀ
        resolved.filter(r => r.item.kind === 'sofa').forEach(sofa => {
          let target = null;
          let targetDist = Infinity;

          // Ưu tiên 1: Hướng về Tivi trong phòng (trong bán kính 6.5m)
          tvList.forEach(tv => {
            const dist = Math.hypot(tv.posX - sofa.posX, tv.posZ - sofa.posZ);
            if (dist < 6.5 && dist < targetDist) {
              targetDist = dist;
              target = tv;
            }
          });

          // Ưu tiên 2: Nếu không có TV, hướng về bàn trà (table) hoặc thảm (rug) gần sofa (trong bán kính 2.8m)
          if (!target) {
            tables.forEach(table => {
              const dist = Math.hypot(table.posX - sofa.posX, table.posZ - sofa.posZ);
              if (dist < 2.8 && dist < targetDist) {
                targetDist = dist;
                target = table;
              }
            });
          }

          if (target) {
            const dx = target.posX - sofa.posX;
            const dz = target.posZ - sofa.posZ;
            if (Math.hypot(dx, dz) > 0.1) {
              // Sofa front là local -Z. Để xoay -Z về (dx, dz):
              sofa.yaw = Math.atan2(dx, -dz) * 180 / Math.PI;
            }
          } else {
            // Ưu tiên 3: Tựa lưng vào bức tường gần nhất, mặt hướng vào trung tâm phòng
            const dLeft = Math.abs(sofa.posX - (-halfW));
            const dRight = Math.abs(sofa.posX - halfW);
            const dBack = Math.abs(sofa.posZ - halfD);
            const dFront = Math.abs(sofa.posZ - (-halfD));
            const minWallDist = Math.min(dLeft, dRight, dBack, dFront);

            if (minWallDist === dBack) sofa.yaw = 0; // tựa lưng vào tường sau (+Z), nhìn -Z vào phòng
            else if (minWallDist === dFront) sofa.yaw = 180; // tựa lưng vào tường trước (-Z), nhìn +Z vào phòng
            else if (minWallDist === dLeft) sofa.yaw = 90; // tựa lưng vào tường trái (-X), nhìn +X vào phòng
            else sofa.yaw = -90; // tựa lưng vào tường phải (+X), nhìn -X vào phòng
          }
        });

        // B6: Xử lý Giường ngủ (Bed) - ĐẦU GIƯỜNG ÁP TƯỜNG, ĐUÔI GIƯỜNG HƯỚNG VÀO TRUNG TÂM PHÒNG
        resolved.filter(r => r.item.kind === 'bed').forEach(bed => {
          const dLeft = Math.abs(bed.posX - (-halfW));
          const dRight = Math.abs(bed.posX - halfW);
          const dBack = Math.abs(bed.posZ - halfD);
          const dFront = Math.abs(bed.posZ - (-halfD));
          const minWallDist = Math.min(dLeft, dRight, dBack, dFront);

          if (minWallDist === dBack) bed.yaw = 0; // Đầu giường áp tường sau (+Z), chân giường hướng -Z
          else if (minWallDist === dFront) bed.yaw = 180; // Đầu giường áp tường trước (-Z), chân giường hướng +Z
          else if (minWallDist === dLeft) bed.yaw = -90; // Đầu giường áp tường trái (-X), chân giường hướng +X
          else bed.yaw = 90; // Đầu giường áp tường phải (+X), chân giường hướng -X
        });

        // B7: Xử lý Tủ quần áo (Wardrobe) & Tủ cao (Cabinet) - LƯNG ÁP TƯỜNG, CỬA MỞ VÀO PHÒNG
        resolved.filter(r => r.item.kind === 'wardrobe' || (r.item.kind === 'cabinet' && (r.item.height || 1) > 1.35)).forEach(wardrobe => {
          const dLeft = Math.abs(wardrobe.posX - (-halfW));
          const dRight = Math.abs(wardrobe.posX - halfW);
          const dBack = Math.abs(wardrobe.posZ - halfD);
          const dFront = Math.abs(wardrobe.posZ - (-halfD));
          const minWallDist = Math.min(dLeft, dRight, dBack, dFront);

          if (minWallDist === dBack) wardrobe.yaw = 0; // Lưng áp tường sau (+Z), cánh mở -Z
          else if (minWallDist === dFront) wardrobe.yaw = 180; // Lưng áp tường trước (-Z), cánh mở +Z
          else if (minWallDist === dLeft) wardrobe.yaw = -90; // Lưng áp tường trái (-X), cánh mở +X
          else wardrobe.yaw = 90; // Lưng áp tường phải (+X), cánh mở -X
        });

        // B8: Xử lý Tivi (Television) - HƯỚNG MÀN HÌNH VỀ SOFA HOẶC GIƯỜNG NGỦ
        const primarySeats = resolved.filter(r => r.item.kind === 'sofa' || r.item.kind === 'bed');
        resolved.filter(r => r.item.kind === 'television' || r.item.kind === 'tv').forEach(tv => {
          let bestSeat = null;
          let minSeatDist = Infinity;
          primarySeats.forEach(seat => {
            const dist = Math.hypot(seat.posX - tv.posX, seat.posZ - tv.posZ);
            if (dist < minSeatDist) {
              minSeatDist = dist;
              bestSeat = seat;
            }
          });

          if (bestSeat && minSeatDist > 0.6) {
            const dx = bestSeat.posX - tv.posX;
            const dz = bestSeat.posZ - tv.posZ;
            tv.yaw = Math.atan2(dx, -dz) * 180 / Math.PI;
          } else {
            const dLeft = Math.abs(tv.posX - (-halfW));
            const dRight = Math.abs(tv.posX - halfW);
            const dBack = Math.abs(tv.posZ - halfD);
            const dFront = Math.abs(tv.posZ - (-halfD));
            const minWallDist = Math.min(dLeft, dRight, dBack, dFront);
            if (minWallDist === dBack) tv.yaw = 0;
            else if (minWallDist === dFront) tv.yaw = 180;
            else if (minWallDist === dLeft) tv.yaw = 90;
            else tv.yaw = -90;
          }
        });

        // B6: Xử lý các vật thể nhỏ để bàn (notebook, water_bottle, lunchbox, book, mug, backpack)
        const smallTableTopKinds = ['water_bottle', 'notebook', 'lunchbox', 'book', 'mug', 'backpack', 'bag'];
        resolved.filter(r => smallTableTopKinds.includes(r.item.kind)).forEach(prop => {
          // Kiểm tra xem có bàn, ghế hoặc tủ bên dưới không
          for (const supp of supports) {
            if (supp === prop) continue;
            const sw = supp.item.width || 1.0;
            const sd = supp.item.depth || 1.0;
            const inX = Math.abs(prop.posX - supp.posX) <= (sw * 0.5 + 0.1);
            const inZ = Math.abs(prop.posZ - supp.posZ) <= (sd * 0.5 + 0.1);
            if (inX && inZ) {
              if (supp.item.kind === 'chair') {
                prop.posY = (supp.item.height || 0.85) * 0.49; // đặt trên mặt ngồi của ghế
              } else {
                prop.posY = supp.item.height || 0.75; // đặt trên mặt bàn/tủ
              }
              break;
            }
          }
        });

        return resolved;
      }

      let routineBadgeCount = 0;
      const solvedObjects = room.layoutVersion === 2
        ? (room.objects || []).map(item => ({ item, posX: item.x, posY: item.kind === 'window' ? 0 : (item.y || 0), posZ: item.z, yaw: item.yaw, wallSide: null }))
        : solveObjectPlacementAndOrientation(room.objects || [], w, d, h);

      // Đảm bảo không ghế nào bị kẹt, chìm trong bàn hoặc quay ngược lưng vào bàn
      resolveChairTableInteractions(solvedObjects);

      solvedObjects.forEach(resolved => {
        const item = resolved.item;
        const posX = resolved.posX;
        const posY = item.kind === 'window' ? 0 : (resolved.posY || 0);
        const posZ = resolved.posZ;
        const rotY = (resolved.yaw || 0) * Math.PI / 180;

        const fGroup = new THREE.Group();
        fGroup.position.set(posX, posY, posZ);
        fGroup.rotation.y = rotY;
        fGroup.userData.furnitureInfo = {
          kind: item.kind,
          label: item.label || item.kind,
          id: item.id,
          description: item.description || (item.source?.type === 'user_provided' ? item.source.evidence : '') || (item.label || item.kind),
          routineLabel: item.routineLabel || '',
          isInteractable: true,
          restrictedDialogue: '',
          height: item.height || 1,
          width: item.width || 1,
          depth: item.depth || 1,
          targetRoomId: item.targetRoomId,
          interaction: item.interaction,
          memoryFragment: item.memoryFragment,
          rawItem: item
        };

        const fw = item.width;
        const fh = item.height;
        const fd = item.depth;

        // Chất liệu vải dệt theo màu
        const fabricCanvas = ['sofa','bed','rug'].includes(item.kind) ? generateFabricCanvas(item.color || '#7e5a48') : null;
        let bodyMat;
        if (fabricCanvas) {
          const fabricTex = new THREE.CanvasTexture(fabricCanvas);
          fabricTex.wrapS = THREE.RepeatWrapping;
          fabricTex.wrapT = THREE.RepeatWrapping;
          fabricTex.repeat.set(2, 2);
          bodyMat = new THREE.MeshStandardMaterial({ map: fabricTex, roughness: 0.8, metalness: 0.02 });
        } else {
          bodyMat = createMaterial(item.color, 0.75, 0.05);
        }
        const creamMat = createMaterial('#F3EBDD', 0.8, 0.0);

        function box(bx, by, bz, bw, bh, bd, mat) {
          return makeBox(fGroup, bx, by, bz, bw, bh, bd, mat, true);
        }

        function legs(legH) {
          const rw = Math.max(0.04, fw * 0.06);
          const rd = Math.max(0.04, fd * 0.06);
          box(-fw * 0.45 + rw / 2, legH / 2, -fd * 0.45 + rd / 2, rw, legH, rd, woodMat);
          box(fw * 0.45 - rw / 2, legH / 2, -fd * 0.45 + rd / 2, rw, legH, rd, woodMat);
          box(-fw * 0.45 + rw / 2, legH / 2, fd * 0.45 - rd / 2, rw, legH, rd, woodMat);
          box(fw * 0.45 - rw / 2, legH / 2, fd * 0.45 - rd / 2, rw, legH, rd, woodMat);
        }

        if (item.textureBase64 && typeof THREE.TextureLoader === 'function') {
          try {
            const customTex = new THREE.TextureLoader().load(item.textureBase64);
            if (THREE.sRGBEncoding) customTex.encoding = THREE.sRGBEncoding;
            customTex.wrapS = THREE.RepeatWrapping;
            customTex.wrapT = THREE.RepeatWrapping;
            bodyMat = new THREE.MeshStandardMaterial({ map: customTex, roughness: 0.6, metalness: 0.05 });
          } catch (e) {}
        }

        switch (item.kind) {
          case 'segmented_sprite':
            legs(fh * 0.85);
            box(0, fh * 0.92, 0, fw, fh * 0.12, fd, woodMat);
            box(0, fh * 0.5, 0, fw * 0.85, fh * 0.65, fd * 0.85, bodyMat);
            break;
          case 'sofa': {
            const sofaLegH = Math.max(0.08, fh * 0.16);
            const sofaBaseY = sofaLegH;
            const sofaSeatH = fh * 0.32;
            const sofaBackH = fh * 0.56;
            const armW = Math.max(0.12, fw * 0.10);
            const armH = fh * 0.44;
            const cushionCount = fw > 1.8 ? 3 : (fw > 1.2 ? 2 : 1);
            const cushionSpan = (fw - armW * 2) / cushionCount;

            // 4 chân gỗ / kim loại nghiêng phong cách Bắc Âu (Scandinavian Tapered Legs)
            const legWoodMat = createMaterial('#332211', 0.6, 0.1);
            const legR = Math.max(0.03, fw * 0.025);
            const l1 = box(-fw * 0.45 + legR, sofaLegH * 0.5, -fd * 0.40 + legR, legR, sofaLegH, legR, legWoodMat);
            const l2 = box(fw * 0.45 - legR, sofaLegH * 0.5, -fd * 0.40 + legR, legR, sofaLegH, legR, legWoodMat);
            const l3 = box(-fw * 0.45 + legR, sofaLegH * 0.5, fd * 0.40 - legR, legR, sofaLegH, legR, legWoodMat);
            const l4 = box(fw * 0.45 - legR, sofaLegH * 0.5, fd * 0.40 - legR, legR, sofaLegH, legR, legWoodMat);
            [l1, l2, l3, l4].forEach(l => { l.userData = { isMetal: true, noTexture: true }; });

            // Khung đế sofa bọc vải
            box(0, sofaBaseY + sofaSeatH * 0.35, 0, fw, sofaSeatH * 0.7, fd * 0.94, bodyMat);

            // Tựa lưng cao ráo, nghiêng nhẹ (Backrest)
            box(0, sofaBaseY + sofaBackH * 0.5 + sofaSeatH * 0.3, fd * 0.38, fw * 0.98, sofaBackH, fd * 0.24, bodyMat);

            // Tay vịn 2 bên bo cong mềm mại (Armrests)
            box(-fw * 0.5 + armW * 0.5, sofaBaseY + armH * 0.5, -fd * 0.02, armW, armH, fd * 0.96, bodyMat);
            box(fw * 0.5 - armW * 0.5, sofaBaseY + armH * 0.5, -fd * 0.02, armW, armH, fd * 0.96, bodyMat);

            // Các đệm ngồi êm ái, bồng bềnh (hướng về -Z)
            const seatDepth = fd * 0.68;
            for (let i = 0; i < cushionCount; i++) {
              const cx = -fw * 0.5 + armW + (i + 0.5) * cushionSpan;
              const cushion = box(cx, sofaBaseY + sofaSeatH + 0.04, -fd * 0.06, cushionSpan * 0.94, 0.12, seatDepth * 0.92, bodyMat);
              cushion.userData.isCushion = true;
            }

            // Gối tựa trang trí phong cách hiện đại (Accent Throw Pillows: Vàng mù tạt, Xanh nhạt, Cam ấm)
            const yellowPillowMat = createMaterial('#EAB308', 0.85, 0.0);
            const bluePillowMat = createMaterial('#38BDF8', 0.85, 0.0);
            const orangePillowMat = createMaterial('#EA580C', 0.85, 0.0);
            const p1 = box(-fw * 0.35, sofaBaseY + sofaSeatH + 0.18, fd * 0.22, 0.28, 0.28, 0.14, yellowPillowMat);
            const p2 = box(0, sofaBaseY + sofaSeatH + 0.18, fd * 0.22, 0.28, 0.28, 0.14, bluePillowMat);
            const p3 = box(fw * 0.35, sofaBaseY + sofaSeatH + 0.18, fd * 0.22, 0.28, 0.28, 0.14, orangePillowMat);
            [p1, p2, p3].forEach(p => { p.userData = { isCushion: true, noTexture: true }; });

            fGroup.userData.isSofa = true;
            fGroup.userData.sitOnSofa = function() {
              playSofaSitSound();
              const startTime = performance.now();
              const dur = 550;
              function stepBounce() {
                const elapsed = performance.now() - startTime;
                const p = Math.min(1, elapsed / dur);
                const s = 1.0 - Math.sin(p * Math.PI) * 0.12;
                fGroup.scale.set(1.0, s, 1.0);
                render();
                if (p < 1) requestAnimationFrame(stepBounce);
                else fGroup.scale.set(1.0, 1.0, 1.0);
              }
              stepBounce();
              window.ReactNativeWebView?.postMessage(JSON.stringify({
                type: 'TACTILE_ACTION',
                action: 'sit_sofa',
                label: item.label
              }));
            };

            addGroundContactShadow(fGroup, fw * 1.05, fd * 1.05, 0.50);
            break;
          }
          case 'table': {
            const isCoffeeTable = (fh <= 0.58) || (fw <= 1.4 && fd <= 0.8 && fh <= 0.65);
            const tableWoodCanvas = generateWoodCanvas(item.color || (isCoffeeTable ? '#8D6E63' : '#D4B088'));
            const tableWoodMat = tableWoodCanvas
              ? new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(tableWoodCanvas), roughness: 0.45, metalness: 0.05 })
              : woodMat;

            if (isCoffeeTable) {
              // Bàn trà phòng khách hiện đại (Low Coffee Table)
              const legThick = Math.max(0.025, fw * 0.035);
              const legH = fh * 0.88;
              const legMat = createMaterial('#27272A', 0.4, 0.4);
              const l1 = box(-fw * 0.42 + legThick / 2, legH * 0.5, -fd * 0.40 + legThick / 2, legThick, legH, legThick, legMat);
              const l2 = box(fw * 0.42 - legThick / 2, legH * 0.5, -fd * 0.40 + legThick / 2, legThick, legH, legThick, legMat);
              const l3 = box(-fw * 0.42 + legThick / 2, legH * 0.5, fd * 0.40 - legThick / 2, legThick, legH, legThick, legMat);
              const l4 = box(fw * 0.42 - legThick / 2, legH * 0.5, fd * 0.40 - legThick / 2, legThick, legH, legThick, legMat);
              [l1, l2, l3, l4].forEach(l => { l.userData = { isMetal: true, noTexture: true }; });

                if (!boxGeometry) boxGeometry = new THREE.BoxGeometry(1, 1, 1);
                const bMesh = new THREE.Mesh(boxGeometry, bookMats);
                bMesh.scale.set(bWidth, bHeight, bDepth);
                bMesh.castShadow = true;

                const posX = currentX + bWidth * 0.5;
                const posY = shelfY + 0.018 + bHeight * 0.5;
                const posZ = -fd * 0.22;
                bMesh.position.set(posX, posY, posZ);

                // Độ nghiêng tự nhiên
                const isTilted = (bookCounter % 5 === 0);
                if (isTilted && (currentX + bWidth * 1.5 < edgeMargin)) {
                  bMesh.rotation.z = -0.11;
                  bMesh.position.x += 0.014;

                bMesh.userData = {

                  parentShelf: fGroup,
                  title: bookData.title,
                  color: bookData.color,
                  pages: bookData.pages,
                  baseZ: posZ,

          case 'cabinet': {

              // Vách ngăn đông & ngăn mát
              const splitY = fh * 0.42;
              box(0, splitY, 0, fw * 0.92, 0.04, fd * 0.90, insideMat);

              // Khay kính ngăn mát
              box(0, splitY * 0.5, 0, fw * 0.90, 0.015, fd * 0.86, shelfMat);
              box(0, splitY * 0.75, 0, fw * 0.90, 0.015, fd * 0.86, shelfMat);
              // Khay ngăn đông
              box(0, splitY + (fh - splitY) * 0.5, 0, fw * 0.90, 0.015, fd * 0.86, shelfMat);

              // Món ăn thanh mát bên trong:
              const milkMat = createMaterial('#38BDF8', 0.5, 0.05);
              makeBox(fGroup, -fw * 0.22, splitY * 0.5 + 0.10, -fd * 0.12, 0.08, 0.18, 0.08, milkMat, true);
              const orangeMat = createMaterial('#F97316', 0.6, 0.05);
              makeBox(fGroup, 0.06, splitY * 0.5 + 0.04, -fd * 0.14, 0.18, 0.03, 0.18, createMaterial('#FFFFFF', 0.3, 0.1), true);
              makeBox(fGroup, 0.06, splitY * 0.5 + 0.09, -fd * 0.14, 0.07, 0.07, 0.07, orangeMat, true);
              makeBox(fGroup, 0.12, splitY * 0.5 + 0.09, -fd * 0.14, 0.06, 0.06, 0.06, orangeMat, true);
              const botMat = createMaterial('#10B981', 0.3, 0.2);
              makeBox(fGroup, -fw * 0.22, splitY * 0.75 + 0.11, -fd * 0.12, 0.08, 0.20, 0.08, botMat, true);

              // Cánh cửa tủ lạnh gắn bản lề bên phải
              const doorPivot = new THREE.Group();
              doorPivot.position.set(fw * 0.48, fh * 0.5, -fd * 0.48);
              fGroup.add(doorPivot);

              const doorW = fw * 0.96;
              const doorH = fh * 0.96;
              const doorD = 0.035;
              makeBox(doorPivot, -doorW * 0.5, 0, 0, doorW, doorH, doorD, fridgeMat, true);
              makeBox(doorPivot, -doorW * 0.5, splitY - fh * 0.5, -doorD * 0.55, doorW, 0.02, 0.01, trimMat, true);
              makeBox(doorPivot, -doorW * 0.88, splitY - fh * 0.5 + 0.08, -doorD * 0.7, 0.03, 0.16, 0.03, handleMat, true);
              makeBox(doorPivot, -doorW * 0.88, splitY - fh * 0.5 - 0.08, -doorD * 0.7, 0.03, 0.16, 0.03, handleMat, true);

              fGroup.userData.isFridge = true;
              fGroup.userData.isFridgeOpen = false;
              fGroup.userData.toggleFridge = function() {
                fGroup.userData.isFridgeOpen = !fGroup.userData.isFridgeOpen;
                playFridgeDoorSound();
                const isOpen = fGroup.userData.isFridgeOpen;
                if (insideMat && insideMat.emissive) insideMat.emissive.setHex(isOpen ? 0x223344 : 0x000000);
                const startRot = doorPivot.rotation.y;
                const targetRot = isOpen ? -Math.PI * 0.62 : 0;
                const startTime = performance.now();
                const dur = 420;
                function stepFridge() {
                  const elapsed = performance.now() - startTime;
                  const p = Math.min(1, elapsed / dur);
                  const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;

            } else if (isKitchenCounter) {

              const baseCabinetMat = createMaterial(item.color || '#64748B', 0.5, 0.1);

              makeBox(cabPivot, -cabDoorW * 0.85, 0, -0.02, 0.03, 0.14, 0.025, sinkMat, true);

                  const elapsed = performance.now() - startTime;
                  const p = Math.min(1, elapsed / dur);
                  const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;

                  label: item.label

          case 'plant': {

            const cluster1 = makeSphere(fGroup, fw * 0.16, fh * 0.82, fd * 0.12, fw * 0.24, createMaterial('#2E7D32', 0.75, 0.0));

            cluster2.scale.set(1.0, 0.85, 1.0);
            const cluster3 = makeSphere(fGroup, -fw * 0.12, fh * 0.86, fd * 0.14, fw * 0.20, createMaterial('#1B5E20', 0.75, 0.0));
            cluster3.scale.set(1.0, 0.85, 1.0);
            const cluster4 = makeSphere(fGroup, fw * 0.14, fh * 0.68, -fd * 0.16, fw * 0.22, createMaterial('#43A047', 0.75, 0.0));
            cluster4.scale.set(1.0, 0.85, 1.0);

            fGroup.userData.isPlant = true;
            fGroup.userData.waterPlant = function() {

              const startTime = performance.now();

          case 'lamp': {

              // Bóng đèn tròn phát sáng ấm (Glowing sphere bulb)

            } else if (isFloorLamp) {

              const stem = makeCylinder(fGroup, 0, fh * 0.48, 0, 0.018, 0.018, fh * 0.92, 16, stemMat);

              fGroup.add(shade);

              const base = makeCylinder(fGroup, 0, fh * 0.03, 0, baseR * 0.9, baseR, fh * 0.06, 24, stemMat);
              const stem = makeCylinder(fGroup, 0, fh * 0.42, 0, 0.014, 0.014, fh * 0.72, 16, stemMat);

          case 'notebook':

            const coverMat = coverCanvas ? new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(coverCanvas), roughness: 0.4, metalness: 0.1 }) : bodyMat;
            const spineMat = spineCanvas ? new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(spineCanvas), roughness: 0.4, metalness: 0.1 }) : bodyMat;
            const edgeMat = edgeCanvas ? new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(edgeCanvas), roughness: 0.85 }) : creamMat;

            // 1. Bìa cứng đáy (Back hardcover board)

            // 6. Ruột 2 trang sách mở cong tự nhiên hình bán nguyệt / vòm (Curved arched open pages mesh)

              const endRot = targetOpen ? Math.PI * 0.94 : 0;
              const startT = performance.now();
              const animDur = 450;

              function stepOpen() {
                const elapsed = performance.now() - startT;

                const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;

                  frontCover.visible = false;

                  openPagesMesh.visible = false;
                  frontCover.visible = true;
                  pBlock.visible = true;

                render();
                if (p < 1) requestAnimationFrame(stepOpen);

                totalPages: totalPages

            makeCylinder(fGroup, handleR * 0.6, stickH * 0.96, 0, shaftR * 1.1, shaftR * 1.1, handleR * 1.4, 16, stickWoodMat).rotation.z = Math.PI / 2;
            makeSphere(fGroup, handleR * 1.2, stickH * 0.93, 0, shaftR * 1.2, stickWoodMat);
            makeCylinder(fGroup, 0, 0.02, 0, shaftR * 1.1, shaftR * 1.2, 0.04, 16, tipMat);
            break;
          }
          case 'cushion': {
            const cushMat = createMaterial(item.color || '#F59E0B', 0.85, 0.0);
            const cushButtonMat = createMaterial('#78350F', 0.5, 0.1);
            const cW = Math.max(0.28, fw);
            const cH = Math.max(0.12, fh);
            const cD = Math.max(0.28, fd);
            makeSphere(fGroup, 0, cH * 0.5, 0, Math.min(cW, cD) * 0.48, cushMat).scale.set(cW / Math.min(cW, cD), cH / Math.min(cW, cD), cD / Math.min(cW, cD));
            makeSphere(fGroup, 0, cH * 0.92, 0, 0.025, cushButtonMat);
            makeSphere(fGroup, 0, cH * 0.08, 0, 0.025, cushButtonMat);
            break;
          }
          default:
            box(0, fh * 0.5, 0, fw, fh, fd, woodMat);
        }

        const isMedicineOrRoutine = room.layoutVersion !== 2 && ((item.label && /thuốc|uống|9h|sinh hoạt/i.test(item.label)) || item.routineLabel) && item.isInteractable !== false;
        if (isMedicineOrRoutine && routineBadgeCount < 1) {
          const badgeText = item.routineLabel || '09:00';
          const badgeSprite = createRoutineBadge(badgeText);
          if (badgeSprite) {
            badgeSprite.position.set(0, fh + 0.22, 0);
            fGroup.add(badgeSprite);
            routineBadgeCount++;
          }
        }

        // Vòng sáng sàn phân biệt đồ vật tương tác với vật thể thông thường
        if (item.isInteractable !== false && item.kind !== 'door') {
          const haloGeo = new THREE.RingGeometry(Math.max(0.18, Math.min(fw, fd) * 0.32), Math.max(0.32, Math.max(fw, fd) * 0.52), 24);
          haloGeo.rotateX(-Math.PI / 2);
          const haloMat = new THREE.MeshBasicMaterial({
            color: 0xf59e0b,
            transparent: true,
            opacity: 0.52,
            side: THREE.DoubleSide

          const groundHalo = new THREE.Mesh(haloGeo, haloMat);
          groundHalo.position.set(0, 0.022, 0);

          fGroup.add(groundHalo);
        }

        // 3D Point-and-Explore Pin ("Điểm Chạm Ký Ức" ✨)
        if (item.isInteractable !== false && item.label) {
          const explorePin = createExplorePin(item.label, item.kind);
          if (explorePin) {
            explorePin.userData = { baseY: fh + 0.32, parentFurnitureGroup: fGroup };
            explorePin.position.set(0, fh + 0.32, 0);
            fGroup.add(explorePin);
          }
        }

        // Invisible Raycast Hit Proxy rộng rãi đảm bảo bấm trúng 100% không yêu cầu thao tác tỉ mỉ
        const proxyW = Math.max(1.15, fw * 1.35);
        const proxyH = Math.max(1.15, fh * 1.35);
        const proxyD = Math.max(1.15, fd * 1.35);
        const proxyMat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false });
        if (!boxGeometry) boxGeometry = new THREE.BoxGeometry(1, 1, 1);
        const hitProxy = new THREE.Mesh(boxGeometry, proxyMat);
        hitProxy.scale.set(proxyW, proxyH, proxyD);
        hitProxy.position.set(0, fh * 0.5, 0);
        hitProxy.userData = { isHitProxy: true, parentGroup: fGroup };
        fGroup.add(hitProxy);

        roomGroup.add(fGroup);
        furnitureMeshes.push(fGroup);
      });

      // Front wall at -d/2 (Child 5 + objects.length)
      const frontWall = makeBox(roomGroup, 0, h / 2, -d / 2, w, h, 0.12, wallMat, true);
      currentFrontWall = frontWall;
      // Right wall at +w/2 (Child 5 + objects.length + 1)
      const rightWall = makeBox(roomGroup, w / 2, h / 2, 0, 0.12, h, d, wallMat, true);
      currentRightWall = rightWall;
      // Front & Right baseboards
      const bbFront = makeBox(roomGroup, 0, 0.08, -d / 2 + 0.08, w, 0.16, 0.06, trimMat, false);
      const bbRight = makeBox(roomGroup, w / 2 - 0.08, 0.08, 0, 0.06, 0.16, d, trimMat, false);
      frontWall.userData.baseboard = bbFront;
      rightWall.userData.baseboard = bbRight;

      // TRẦN NHÀ (CEILING)
      const geoCeiling = new THREE.PlaneGeometry(w, d);
      geoCeiling.rotateX(Math.PI / 2); // Hướng mặt trần xuống phía trong căn phòng
      const ceilingMat = new THREE.MeshStandardMaterial({
        color: '#f8f5ee',
        roughness: 0.95,
        metalness: 0.0,
        side: THREE.DoubleSide
      });
      ceilingMesh = new THREE.Mesh(geoCeiling, ceilingMat);
      ceilingMesh.position.set(0, h, 0);
      ceilingMesh.userData.surface = roomGroup.userData.surfaceRegions.find(region => region.label === 'ceiling') || {
        surface_id: 'ceiling',
        label: 'ceiling',
        projection: 'procedural_planar_uv',
        confidence: 0,
        provenance: 'room_geometry_prior'
      };
      roomGroup.add(ceilingMesh);

      // ĐÈN TRẦN / QUẠT TRẦN KỶ NIỆM (CEILING FIXTURE)
      const ceilingFixture = new THREE.Group();
      ceilingFixture.position.set(0, h - 0.04, 0);
      makeBox(ceilingFixture, 0, 0, 0, 0.36, 0.06, 0.36, createMaterial('#DDD5C5', 0.6, 0.2), false);
      makeBox(ceilingFixture, 0, -0.05, 0, 1.25, 0.05, 0.2, createMaterial('#FFFFF5', 0.2, 0.1), false);
      roomGroup.add(ceilingFixture);

      // KIẾN TRÚC TRẦN TIÊU ÂM LAM GỖ THƯ VIỆN (ACOUSTIC TIMBER PERGOLA BAFFLES)
      const isLibraryOrStudy = (room.objects || []).some(it => it.kind === 'shelf' || it.kind === 'pillar' || it.kind === 'desk');
      if (isLibraryOrStudy) {
        const pergolaGroup = new THREE.Group();
        const timberMat = createMaterial('#BA7E4C', 0.55, 0.05);
        const slatCount = 9;
        const slatLen = Math.min(3.6, w * 0.65);
        const slatH = 0.16;
        const slatThick = 0.04;
        const slatSpacing = 0.28;
        for (let s = 0; s < slatCount; s++) {
          const sz = - (slatCount - 1) * slatSpacing * 0.5 + s * slatSpacing;
          makeBox(pergolaGroup, 0, h - slatH * 0.5 - 0.04, sz, slatLen, slatH, slatThick, timberMat, false);
        }
        // Đèn rọi ấm áp âm trần giữa các lam gỗ
        const warmSpot = new THREE.PointLight(0xFFE4A0, 0.85, 6.0, 1.5);
        warmSpot.position.set(0, h - 0.22, 0);
        pergolaGroup.add(warmSpot);
        roomGroup.add(pergolaGroup);
      }

      wallMeshes.push(frontWall, rightWall, ceilingMesh);
      updateWallCutaway();

      buildRoomHotspots(room, w, d, h);
      updateCollisionBoxes();
      renderer.shadowMap.needsUpdate = true;
      scheduleFrame();

      if (navMode === 'fpv') {
        const startX = 0;
        const startZ = Math.min((d || 6) * 0.25, 1.8);
        camera.position.set(startX, PLAYER_HEIGHT, startZ);
        fpvYaw = 0;
        fpvPitch = 0;
        camera.rotation.order = 'YXZ';
        camera.rotation.set(0, 0, 0);
        if (!findSafeSpawn()) window.setNavMode('overview');
      } else {

      }

      // Textures are applied by the React bridge after the new room is ready.

      render();

    function loadTextureFromBase64(b64DataUrl, repeatX = 1, repeatY = 1) {
      if (!b64DataUrl || typeof THREE === 'undefined' || typeof THREE.TextureLoader !== 'function') return null;
      try {
        const loader = new THREE.TextureLoader();
        const tex = loader.load(b64DataUrl, () => {
          if (typeof render === 'function') render();
        });
        if (tex) {
          if ('colorSpace' in tex && THREE.SRGBColorSpace) {
            tex.colorSpace = THREE.SRGBColorSpace;
          } else if ('encoding' in tex && THREE.sRGBEncoding) {
            tex.encoding = THREE.sRGBEncoding;
          }
          if (tex.wrapS !== undefined) tex.wrapS = THREE.RepeatWrapping || 1000;
          if (tex.wrapT !== undefined) tex.wrapT = THREE.RepeatWrapping || 1000;
          if (tex.repeat && typeof tex.repeat.set === 'function') tex.repeat.set(repeatX, repeatY);
          if (renderer && renderer.capabilities && typeof renderer.capabilities.getMaxAnisotropy === 'function') {
            tex.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy() || 1);
          }
        }
        return tex;
      } catch (e) {
        return null;
      }
    }

    // Own photo textures separately so shared maps are disposed exactly once.
    const photoMaterials = new Map();
    const photoTextures = new Set();
    function clearPhotoTextures() {
      photoMaterials.forEach((original, material) => {
        if (original && typeof original === 'object') {
          material.map = original.map !== undefined ? original.map : original;
          if (original.roughness !== undefined) material.roughness = original.roughness;
          if (original.color && material.color) material.color.copy(original.color);
        } else {
          material.map = original;
        }
        material.needsUpdate = true;
      });
      photoMaterials.clear();
      photoTextures.forEach(texture => texture.dispose());
      photoTextures.clear();
    }
    function applyExtractedTextures(texPack) {
      clearPhotoTextures();
      extractedTextures = texPack || {};
      if (!roomGroup || !texPack || typeof texPack !== 'object') return;
      const cache = new Map();
      function apply(mesh, kind, x, y) {
        let texSrc = texPack[kind];
        if (!texSrc && kind === 'table' && texPack['desk']) texSrc = texPack['desk'];
        if (!texSrc && kind === 'screen' && texPack['board']) texSrc = texPack['board'];
        if (!texSrc && kind === 'board' && texPack['screen']) texSrc = texPack['screen'];
        if (!texSrc && kind === 'bed' && texPack['sofa']) texSrc = texPack['sofa'];
        if (!texSrc && kind === 'rug' && (texPack['carpet'] || texPack['floor'])) texSrc = texPack['carpet'] || texPack['floor'];
        if (!mesh?.material || typeof texSrc !== 'string') return;
        const key = kind + ':' + x + ':' + y;
        if (!cache.has(key)) {
          const texture = loadTextureFromBase64(texSrc, x, y);
          cache.set(key, texture);
          if (texture) photoTextures.add(texture);
        }
        const texture = cache.get(key);
        if (!texture) return;
        const materials = Array.isArray(mesh.material) ? mesh.material : [mesh.material];
        materials.forEach(material => {
          if (!photoMaterials.has(material)) {
            photoMaterials.set(material, {
              map: material.map,
              roughness: material.roughness,
              color: material.color ? material.color.clone() : null
            });
          }
          material.map = texture;
          if (material.color && (kind === 'floor' || kind === 'wall' || kind === 'ceiling')) {
            material.color.set(0xffffff); // Only floor/wall/ceiling reset to 0xffffff so furniture retains realistic base tones
          }
          if (texPack.pbr_materials && texPack.pbr_materials[kind]) {
            const pbr = texPack.pbr_materials[kind];
            if (typeof pbr.roughness === 'number') material.roughness = pbr.roughness;
            if (pbr.material_type && (pbr.material_type.includes('marble') || pbr.material_type.includes('stone'))) {
              material.metalness = 0.08;
            } else if (pbr.material_type && pbr.material_type.includes('leather')) {
              material.metalness = 0.02;
            } else if (pbr.material_type && (pbr.material_type.includes('linen') || pbr.material_type.includes('carpet'))) {
              material.metalness = 0.0;
            }
          }
          material.needsUpdate = true;
        });
      }
      const rw = roomGroup.userData.width || 6, rd = roomGroup.userData.depth || 6;
      apply(floorMesh, 'floor', Math.max(2, Math.round(rw * .8)), Math.max(2, Math.round(rd * .8)));
      wallMeshes.forEach(mesh => { if (mesh !== ceilingMesh) apply(mesh, 'wall', 4, 2); });
      apply(ceilingMesh, 'ceiling', 4, 4);
      const mapping = {
        desk: ['desk', 2, 2],
        table: ['table', 2, 2],
        podium: ['desk', 1, 1],
        shelf: ['desk', 2, 3],
        wardrobe: ['desk', 2, 2],
        chair: ['chair', 1, 1],
        whiteboard: ['board', 1, 1],
        blackboard: ['board', 1, 1],
        board: ['board', 1, 1],
        projector_screen: ['screen', 1, 1],
        television: ['screen', 1, 1],
        tv: ['screen', 1, 1],
        sofa: ['sofa', 2, 2],
        bed: ['bed', 2, 2],
        rug: ['rug', 2, 2]
      };
      furnitureMeshes.forEach(group => {
        const info = group.userData?.furnitureInfo;
        const kind = info?.kind;
        const target = mapping[kind];
        if (target) {
          const fw = Math.max(1, Math.round(info?.width || target[1]));
          const fd = Math.max(1, Math.round(info?.depth || target[2]));
          group.traverse(child => {
            if (child.isMesh) {
              // Preserve tagged protected items: books, signs, metal, glass, lights, shadows
              if (
                child.userData?.noTexture ||
                child.userData?.isBook ||
                child.userData?.isSign ||
                child.userData?.isMetal ||
                (child.material && typeof child.material.metalness === 'number' && child.material.metalness >= 0.3)
              ) {
                return;
              }

              // For shelves, only apply desk wood texture to horizontal wooden planks (never books, signs, or frame)
              if (kind === 'shelf' && !child.userData?.isWoodPlank) {
                return;
              }

              // For chairs, only apply chair texture to wooden backplate / seat base (never cushions or metal)
              if (kind === 'chair' && !child.userData?.isWoodPlank) {
                return;
              }

              // For beds: wooden headboard & base frame get desk wood texture, while duvet/mattress gets bed fabric texture
              if (kind === 'bed') {
                if (child.userData?.isWoodPlank) {
                  apply(child, 'desk', fw, fd);
                  return;
                }
              }

              apply(child, target[0], fw, fd);
            }
          });
        }
      });
      render();
    }

    window.applyExtractedTextures = applyExtractedTextures;
    window.loadTextureFromBase64 = loadTextureFromBase64;

    if (typeof window.addEventListener === 'function') {
      window.addEventListener('message', (e) => {
        try {
          const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          if (data && (data.type === 'TEXTURES' || data.type === 'APPLY_TEXTURES')) {
            applyExtractedTextures(data.textures);
          }
        } catch {}
      });
    }

    
    function getInteriorViewpoint(viewName) {
      if (!roomGroup) return { pos: new THREE.Vector3(0, 1.55, -2.2), look: new THREE.Vector3(0, 1.15, 0.5) };
      const w = roomGroup.userData?.width || 6;
      const d = roomGroup.userData?.depth || 6;
      const halfW = w * 0.5;
      const halfD = d * 0.5;

      if (viewName === 'center') {
        return {
          pos: new THREE.Vector3(0, 1.55, 0),
          look: new THREE.Vector3(0, 1.15, halfD - 0.6)
        };
      }

      if (viewName === 'corner_desk' || viewName === 'desk') {
        const deskObj = furnitureMeshes.find(f => {
          const k = f.userData?.furnitureInfo?.kind || '';
          return k === 'desk' || k === 'table' || k === 'shelf';
        });
        if (deskObj) {
          const wp = new THREE.Vector3();
          deskObj.getWorldPosition(wp);
          const camX = Math.max(-halfW + 0.6, Math.min(halfW - 0.6, wp.x > 0 ? wp.x - 1.15 : wp.x + 1.15));
          const camZ = Math.max(-halfD + 0.6, Math.min(halfD - 0.6, wp.z));
          return {
            pos: new THREE.Vector3(camX, 1.45, camZ),
            look: new THREE.Vector3(wp.x, 0.85, wp.z)
          };
        }
        return {
          pos: new THREE.Vector3(halfW - 1.1, 1.45, -halfD + 1.3),
          look: new THREE.Vector3(halfW - 1.1, 0.85, 0)
        };
      }

      if (viewName === 'corner_rest' || viewName === 'rest') {
        const restObj = furnitureMeshes.find(f => {
          const k = f.userData?.furnitureInfo?.kind || '';
          return k === 'bed' || k === 'sofa' || k === 'chair';
        });
        if (restObj) {
          const wp = new THREE.Vector3();
          restObj.getWorldPosition(wp);
          const camX = Math.max(-halfW + 0.6, Math.min(halfW - 0.6, wp.x > 0 ? wp.x - 1.2 : wp.x + 1.2));
          const camZ = Math.max(-halfD + 0.6, Math.min(halfD - 0.6, wp.z));
          return {
            pos: new THREE.Vector3(camX, 1.35, camZ),
            look: new THREE.Vector3(wp.x, 0.8, wp.z)
          };
        }
        return {
          pos: new THREE.Vector3(-halfW + 1.1, 1.35, halfD - 1.2),
          look: new THREE.Vector3(0, 0.8, 0)
        };
      }

      if (viewName === 'corner_window' || viewName === 'corner' || viewName === 'window') {
        return {
          pos: new THREE.Vector3(halfW - 0.8, 1.55, halfD - 0.8),
          look: new THREE.Vector3(-w * 0.15, 1.15, -d * 0.15)
        };
      }

      // Mặc định: đứng từ cửa phòng nhìn vào trong
      return {
        pos: new THREE.Vector3(0, 1.55, -halfD + 0.85),
        look: new THREE.Vector3(0, 1.15, d * 0.15)
      };
    }
    
    function triggerEdgeGlow(direction) {
      const el = document.getElementById('edge-glow-' + direction);
      if (!el) return;
      el.classList.remove('pulse');
      void el.offsetWidth; // Force CSS reflow
      el.classList.add('pulse');
      setTimeout(() => {
        el.classList.remove('pulse');
      }, 550);
    }

    window.rotateView = function(direction) {
      if (!roomGroup || !camera || !controls) return;
      // direction: 'left' | 'right' | 'up' | 'down'
      triggerEdgeGlow(direction);

      if (navMode === 'fpv') {
        if (direction === 'left') fpvYaw += (Math.PI / 6);
        else if (direction === 'right') fpvYaw -= (Math.PI / 6);
        else if (direction === 'up') fpvPitch = Math.min(Math.PI * 0.25, fpvPitch + 0.2);
        else if (direction === 'down') fpvPitch = Math.max(-Math.PI * 0.25, fpvPitch - 0.2);
        camera.rotation.set(fpvPitch, fpvYaw, 0, 'YXZ');
        playInteractChime();
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'POV_STATE',
          mode: (direction === 'up' || direction === 'down') ? 'tilted' : 'rotated',
          direction: direction
        }));
        return;
      }

      const curLook = controls.target.clone();
      const camPos = camera.position.clone();

      if (direction === 'up' || direction === 'down') {
        const deltaY = (direction === 'up') ? 0.45 : -0.45;
        const maxH = (roomGroup.userData?.height || 3.0);
        const newY = Math.max(0.25, Math.min(maxH + 0.35, curLook.y + deltaY));
        const newLook = new THREE.Vector3(curLook.x, newY, curLook.z);

        playInteractChime();
        animateCameraTo(camPos, newLook, () => {
          if (controls) {
            controls.target.copy(newLook);
            controls.update();
          }
          if (lastStableVantage) {
            lastStableVantage.look = newLook.clone();
          }
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            type: 'POV_STATE',
            mode: 'tilted',
            direction: direction
          }));
        });
        return;
      }

      // Xoay góc nhìn 30 độ (Math.PI / 6) quanh vị trí đang đứng (xoay phải quay phải, xoay trái quay trái)
      const angleDelta = (direction === 'left') ? (Math.PI / 6) : (-Math.PI / 6);
      const dirX = curLook.x - camPos.x;
      const dirZ = curLook.z - camPos.z;
      const currentDist = Math.hypot(dirX, dirZ) || 2.5;
      const curAngle = Math.atan2(dirX, dirZ);

      const newAngle = curAngle + angleDelta;
      const newLook = new THREE.Vector3(
        camPos.x + Math.sin(newAngle) * currentDist,
        curLook.y,
        camPos.z + Math.cos(newAngle) * currentDist
      );

      playInteractChime();
      animateCameraTo(camPos, newLook, () => {
        if (controls) {
          controls.target.copy(newLook);
          controls.update();
        }
        if (lastStableVantage) {
          lastStableVantage.look = newLook.clone();
        }
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'POV_STATE',
          mode: 'rotated',
          direction: direction
        }));
      });
    };
    window.setCameraView = function(viewName) {
      if (!roomGroup) return;
      isFocusedPov = false;
      activeFocusedFurniture = null;
      if (typeof clearFurnitureHighlight === 'function') clearFurnitureHighlight();

      const v = getInteriorViewpoint(viewName);
      lastStableVantage = { pos: v.pos.clone(), look: v.look.clone(), viewName: viewName };

      animateCameraTo(v.pos, v.look, () => {
        if (controls) {
          controls.target.copy(v.look);
          controls.update();
        }
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'POV_STATE',
          mode: 'viewpoint',
          viewName: viewName
        }));
      });
    };

    let camAnimId = null;
    function animateCameraTo(targetPos, targetLook, targetDist, onComplete) {
      if (typeof onComplete !== 'function' && typeof targetDist === 'function') {
        onComplete = targetDist;
        targetDist = null;
      }

      if (typeof cancelAnimationFrame === 'function' && camAnimId) cancelAnimationFrame(camAnimId);
      if (!appActive || document.hidden) {
        camAnimId = null;
        camera.position.copy(targetPos); controls.target.copy(targetLook);
        if (typeof targetDist === 'number') desiredOrbitDistance = targetDist;
        controls.update(); onComplete?.(); return;
      }
      const startPos = camera.position.clone();
      const startLook = controls.target.clone();
      const duration = 750;
      const getNow = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
      const startTime = getNow();
      function step() {
        const elapsed = getNow() - startTime;
        const t = Math.min(1, elapsed / duration);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        camera.position.lerpVectors(startPos, targetPos, ease);
        controls.target.lerpVectors(startLook, targetLook, ease);
        camera.updateProjectionMatrix();
        controls.update();
        applyPopperCam();
        render();
        if (t < 1 && typeof requestAnimationFrame === 'function') {
          camAnimId = requestAnimationFrame(step);
        } else {
          camAnimId = null;
          if (typeof targetDist === 'number') desiredOrbitDistance = targetDist;
          onComplete?.();
        }
      }
      if (typeof requestAnimationFrame === 'function') {
        camAnimId = requestAnimationFrame(step);
      } else {
        step();
      }
    }

    function render() {
      if (hotspotMeshes && hotspotMeshes.length > 0) {
        const s = 1.0 + 0.12 * Math.sin(Date.now() * 0.004);
        for (let i = 0; i < hotspotMeshes.length; i++) {
          const parent = hotspotMeshes[i].userData?.hotspotParent;
          if (parent) {
            parent.traverse(c => {
              if (c.userData?.isPulse) c.scale.set(s, s, s);
            });
          }
        }
      }

      if (appActive && !document.hidden) {
        updateWallCutaway();
        renderer.render(scene, camera);
        scheduleFrame();
      }
    }

    try { init(); } catch (error) { window.ReactNativeWebView?.postMessage(JSON.stringify({type:'ERROR', message:'Không khởi tạo được 3D trên thiết bị này.'})); }
  </script>
</body>
</html>
