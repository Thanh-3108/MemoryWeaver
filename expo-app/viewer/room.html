<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #18201d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; touch-action: none; }
    
    #top-nav-bar {
      position: absolute; top: 14px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 100;
    }
    #btn-back-overview {
      background: rgba(16, 32, 24, 0.96); border: 2px solid #81c784;
      color: #ffffff; padding: 12px 22px; border-radius: 26px; font-size: 14px; font-weight: 700;
      cursor: pointer; backdrop-filter: blur(12px); box-shadow: 0 6px 22px rgba(0,0,0,0.6);
      display: none; pointer-events: auto; transition: all 0.2s ease;
    }
    #btn-back-overview:active { transform: scale(0.96); background: #2f453c; }

    #pov-hint-badge {
      background: rgba(16, 28, 22, 0.92); border: 1.5px solid rgba(129, 199, 132, 0.45);
      color: #c8e6c9; padding: 8px 16px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
      backdrop-filter: blur(8px); display: block; pointer-events: none;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    #bubble-overlay {
      position: absolute; bottom: 24px; left: 16px; right: 16px;
      display: none; justify-content: center; pointer-events: none; z-index: 100;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bubble-card {
      background: rgba(18, 26, 23, 0.96); border: 1px solid #3c5449; border-radius: 16px;
      padding: 14px 18px; color: #ebf3ee; font-size: 13.5px; line-height: 1.5; max-width: 360px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55); display: flex; align-items: center; gap: 12px;
      pointer-events: auto;
    }
    .bubble-avatar { font-size: 24px; }
    #bubble-text { flex: 1; }

    #empty-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #9bb0a7; text-align: center; padding: 20px; box-sizing: border-box; pointer-events: none;
      background: #18201d;
    }
    #empty-overlay h2 { font-size: 18px; margin-bottom: 8px; color: #d4e3dc; letter-spacing: 0.5px; }
    #empty-overlay p { font-size: 13px; margin: 0; max-width: 290px; line-height: 1.55; color: #829a8f; }

    /* --- FPV HUD & CONTROLS --- */
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      pointer-events: none; z-index: 200;
      display: none;
      transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }
    #crosshair::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      width: 3px; height: 3px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    #crosshair.interactable {
      border-color: #81c784;
      background: rgba(76, 175, 80, 0.35);
      transform: translate(-50%, -50%) scale(1.3);
    }
    #crosshair.restricted {
      border-color: #e57373;
      background: rgba(244, 67, 54, 0.3);
      transform: translate(-50%, -50%) scale(1.15);
    }

    #crosshair-label {
      position: absolute; top: calc(50% + 22px); left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 26, 23, 0.9);
      border: 1px solid rgba(129, 199, 132, 0.45);
      color: #e8f5e9;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 11.5px;
      font-weight: 600;
      pointer-events: none;
      z-index: 200;
      display: none;
      white-space: nowrap;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.45);
    }

    #joystick-zone {
      position: absolute; bottom: 28px; left: 24px;
      width: 136px; height: 136px;
      z-index: 999;
      touch-action: none;
      display: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #joystick-base {
      width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.18) 0%, rgba(15, 23, 42, 0.82) 75%);
      border: 2px solid rgba(52, 211, 153, 0.7);
      border-radius: 50%;
      position: relative;
      backdrop-filter: blur(12px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), inset 0 0 16px rgba(52, 211, 153, 0.25);
    }
    .joy-arrow {
      position: absolute;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.55);
      font-weight: bold;
      pointer-events: none;
      user-select: none;
    }
    .joy-up { top: 6px; left: 50%; transform: translateX(-50%); }
    .joy-down { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .joy-left { left: 8px; top: 50%; transform: translateY(-50%); }
    .joy-right { right: 8px; top: 50%; transform: translateY(-50%); }
    #joystick-stick {
      width: 52px; height: 52px;
      background: radial-gradient(circle at 35% 35%, #34d399, #059669);
      border: 2.5px solid #ffffff;
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.8), inset 0 2px 5px rgba(255, 255, 255, 0.7);
    }

    #btn-exit-fpv {
      background: rgba(24, 34, 30, 0.92); border: 1px solid rgba(255, 255, 255, 0.28);
      color: #e4efe9; padding: 10px 16px; border-radius: 22px; font-size: 13px; font-weight: 600;
      cursor: pointer; backdrop-filter: blur(10px); box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: none; pointer-events: auto; transition: all 0.2s ease;
    }
    #btn-exit-fpv:active { transform: scale(0.96); background: #2f453c; }

    #btn-sound-toggle {
      display: none !important;
      pointer-events: none;
    }

    #fpv-hint-badge {
      background: rgba(24, 34, 30, 0.88); border: 1px solid rgba(129, 199, 132, 0.35);
      color: #a5d6a7; padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 500;
      backdrop-filter: blur(8px); display: none; pointer-events: none;
    }

    /* --- Subtle Ambient Edge Glow (Tap Edge to Turn / Tilt) --- */
    .edge-glow-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 12;
      overflow: hidden;
    }
    .edge-glow-zone {
      position: absolute;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, box-shadow 0.4s ease, background 0.4s ease;
      opacity: 0.16;
    }
    .edge-glow-left {
      top: 18%; bottom: 18%; left: 0;
      width: 44px;
      background: linear-gradient(to right, rgba(45, 106, 79, 0.3) 0%, rgba(45, 106, 79, 0.05) 70%, transparent 100%);
      box-shadow: inset 3px 0 10px rgba(82, 183, 136, 0.22);
      border-top-right-radius: 22px;
      border-bottom-right-radius: 22px;
    }
    .edge-glow-right {
      top: 18%; bottom: 18%; right: 0;
      width: 44px;
      background: linear-gradient(to left, rgba(45, 106, 79, 0.3) 0%, rgba(45, 106, 79, 0.05) 70%, transparent 100%);
      box-shadow: inset -3px 0 10px rgba(82, 183, 136, 0.22);
      border-top-left-radius: 22px;
      border-bottom-left-radius: 22px;
    }
    .edge-glow-top {
      left: 22%; right: 22%; top: 0;
      height: 38px;
      background: linear-gradient(to bottom, rgba(45, 106, 79, 0.26) 0%, rgba(45, 106, 79, 0.05) 70%, transparent 100%);
      box-shadow: inset 0 3px 10px rgba(82, 183, 136, 0.2);
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    .edge-glow-bottom {
      left: 22%; right: 22%; bottom: 0;
      height: 38px;
      background: linear-gradient(to top, rgba(45, 106, 79, 0.26) 0%, rgba(45, 106, 79, 0.05) 70%, transparent 100%);
      box-shadow: inset 0 -3px 10px rgba(82, 183, 136, 0.2);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }
    .edge-indicator-icon {
      font-size: 16px;
      font-weight: 700;
      color: #1b4332;
      opacity: 0.35;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.85);
      user-select: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .edge-glow-zone.pulse {
      opacity: 0.65;
      box-shadow: 0 0 18px rgba(82, 183, 136, 0.65), inset 0 0 14px rgba(82, 183, 136, 0.55);
    }
    .edge-glow-left.pulse {
      background: linear-gradient(to right, rgba(82, 183, 136, 0.45) 0%, rgba(82, 183, 136, 0.15) 75%, transparent 100%);
    }
    .edge-glow-right.pulse {
      background: linear-gradient(to left, rgba(82, 183, 136, 0.45) 0%, rgba(82, 183, 136, 0.15) 75%, transparent 100%);
    }
    .edge-glow-top.pulse {
      background: linear-gradient(to bottom, rgba(82, 183, 136, 0.45) 0%, rgba(82, 183, 136, 0.15) 75%, transparent 100%);
    }
    .edge-glow-bottom.pulse {
      background: linear-gradient(to top, rgba(82, 183, 136, 0.45) 0%, rgba(82, 183, 136, 0.15) 75%, transparent 100%);
    }
    .edge-glow-zone.pulse .edge-indicator-icon {
      opacity: 0.95;
      transform: scale(1.35);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  
  <!-- Subtle Ambient Edge Glow & Turn Guides (Tap edges to rotate/tilt) -->
  <div id="edge-glow-overlay" class="edge-glow-overlay">
    <div id="edge-glow-left" class="edge-glow-zone edge-glow-left" title="Chạm mép trái để xoay sang trái">
      <span class="edge-indicator-icon">‹</span>
    </div>
    <div id="edge-glow-right" class="edge-glow-zone edge-glow-right" title="Chạm mép phải để xoay sang phải">
      <span class="edge-indicator-icon">›</span>
    </div>
    <div id="edge-glow-top" class="edge-glow-zone edge-glow-top" title="Chạm mép trên để ngửa nhìn lên">
      <span class="edge-indicator-icon">ˆ</span>
    </div>
    <div id="edge-glow-bottom" class="edge-glow-zone edge-glow-bottom" title="Chạm mép dưới để hạ nhìn xuống">
      <span class="edge-indicator-icon">ˇ</span>
    </div>
  </div>

  <div id="top-nav-bar">
    <button id="btn-back-overview" onclick="window.resetCameraOverview()">⬅️ Toàn cảnh</button>
    <button id="btn-exit-fpv" onclick="window.setNavMode('overview')">🏰 Toàn cảnh</button>
    <button id="btn-sound-toggle" onclick="window.toggleRoomAudio()">🔊 Âm thanh</button>
    <div id="pov-hint-badge">✨ Chạm đồ vật để khám phá</div>
    <div id="fpv-hint-badge">🕹️ Cần gạt: Đi • Vuốt: Nhìn quanh</div>
  </div>

  <div id="crosshair"></div>
  <div id="crosshair-label"></div>

  <div id="joystick-zone">
    <div id="joystick-base">
      <div class="joy-arrow joy-up">▲</div>
      <div class="joy-arrow joy-down">▼</div>
      <div class="joy-arrow joy-left">◀</div>
      <div class="joy-arrow joy-right">▶</div>
      <div id="joystick-stick"></div>
    </div>
  </div>

  <div id="bubble-overlay">
    <div class="bubble-card">
      <div class="bubble-avatar">👵</div>
      <div id="bubble-text">Khám phá không gian ký ức thân quen</div>
    </div>
  </div>

  <div id="empty-overlay">
    <h2>Căn phòng ký ức</h2>
    <p>Nhập mô tả hoặc chọn ảnh rồi bấm Gửi.</p>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let hemiLight = null, sun = null, bounceLight = null, fillLight = null;
    let cachedContactShadowTex = null;
    let roomGroup = null;
    let boxGeometry = null;
    let frameId = null;
    let appActive = true;
    let hoverElapsed = 0;
    const playerBox = new THREE.Box3();
    let floorMesh = null;
    let ceilingMesh = null;
    let currentFrontWall = null;
    let currentBackWall = null;
    let currentLeftWall = null;
    let currentRightWall = null;

    function clampCameraInsideRoom() {
      if (!roomGroup || !camera) return false;
      const w = roomGroup.userData?.width || 6;
      const d = roomGroup.userData?.depth || 6;
      const h = roomGroup.userData?.height || 3;
      const margin = 0.32; // Giữ camera luôn cách tường ít nhất 32cm, không bao giờ xuyên ra ngoài
      const minX = -w * 0.5 + margin;
      const maxX = w * 0.5 - margin;
      const minZ = -d * 0.5 + margin;
      const maxZ = d * 0.5 - margin;
      const minY = 0.38;
      const maxY = h - 0.22;

      let clamped = false;
      if (camera.position.x < minX) { camera.position.x = minX; clamped = true; }
      if (camera.position.x > maxX) { camera.position.x = maxX; clamped = true; }
      if (camera.position.z < minZ) { camera.position.z = minZ; clamped = true; }
      if (camera.position.z > maxZ) { camera.position.z = maxZ; clamped = true; }
      if (camera.position.y < minY) { camera.position.y = minY; clamped = true; }
      if (camera.position.y > maxY) { camera.position.y = maxY; clamped = true; }
      return clamped;
    }

    function updateWallCutaway() {
      clampCameraInsideRoom();
      // Đảm bảo không gian phòng khép kín hoàn toàn, camera bên trong không bao giờ nhìn thấy the void
      if (currentFrontWall) {
        currentFrontWall.visible = true;
        if (currentFrontWall.userData?.baseboard) currentFrontWall.userData.baseboard.visible = true;
      }
      if (currentBackWall) {
        currentBackWall.visible = true;
        if (currentBackWall.userData?.baseboard) currentBackWall.userData.baseboard.visible = true;
      }
      if (currentLeftWall) {
        currentLeftWall.visible = true;
        if (currentLeftWall.userData?.baseboard) currentLeftWall.userData.baseboard.visible = true;
      }
      if (currentRightWall) {
        currentRightWall.visible = true;
        if (currentRightWall.userData?.baseboard) currentRightWall.userData.baseboard.visible = true;
      }
      if (ceilingMesh) ceilingMesh.visible = true;
    }

    let extractedTextures = {};
    const furnitureMeshes = [];
    const wallMeshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let touchStartTime = 0;
    let touchStartPos = { x: 0, y: 0 };
    let desiredOrbitDistance = 7.5;
    let isAdjustingPopper = false;
    let isFocusedPov = false;
    let lastStableVantage = null;

    // --- 3D POINT-AND-EXPLORE & LOCKED CAMERA SYSTEM ---
    let isCameraLocked = true; // Khóa xoay tự do để chống mất phương hướng, chóng mặt và khó thao tác
    let pointAndExploreMode = true;

    // --- FIRST-PERSON VIEW (FPV) NAVIGATION SYSTEM ---
    let navMode = 'overview'; // 'overview' | 'fpv'
    const PLAYER_HEIGHT = 1.65; // Eye level in meters
    const PLAYER_RADIUS = 0.28; // Collision radius in meters
    const WALK_SPEED = 2.4;     // Move speed in m/s
    let fpvYaw = 0;             // Horizontal view angle in radians
    let fpvPitch = 0;           // Vertical view angle in radians (clamped)
    const moveInput = { forward: 0, right: 0 };
    const keysPressed = {};
    const staticAABBs = [];
    let lastFrameTime = 0;
    let hoveredObject = null;
    let fpvTouchId = null;
    let fpvTouchPrevPos = { x: 0, y: 0 };
    let isMouseDown = false;
    let prevMousePos = { x: 0, y: 0 };

    function updateCollisionBoxes() {
      staticAABBs.length = 0;
      if (!roomGroup) return;
      furnitureMeshes.forEach(group => {
        const info = group.userData?.furnitureInfo;
        const kind = info?.kind || '';
        // Skip small props and ceiling/wall fixtures that should not block walking
        if (['rug', 'picture', 'notebook', 'water_bottle', 'mug', 'clock', 'curtain', 'air_conditioner', 'fan', 'projector', 'projector_screen'].includes(kind)) return;
        const box = new THREE.Box3().setFromObject(group);
        // Slightly contract box 2cm to avoid getting stuck when walking close
        box.min.x += 0.02; box.min.z += 0.02;
        box.max.x -= 0.02; box.max.z -= 0.02;
        staticAABBs.push(box);
      });
    }

    function checkPositionCollision(x, z) {
      if (!roomGroup) return false;
      const w = roomGroup.userData.width || 6;
      const d = roomGroup.userData.depth || 6;
      const margin = PLAYER_RADIUS + 0.08;
      // Collision with 4 outer walls
      if (x < -w / 2 + margin || x > w / 2 - margin || z < -d / 2 + margin || z > d / 2 - margin) {
        return true;
      }
      // Collision with furniture AABB boxes
      playerBox.min.set(x - PLAYER_RADIUS, 0.05, z - PLAYER_RADIUS);
      playerBox.max.set(x + PLAYER_RADIUS, PLAYER_HEIGHT * 0.9, z + PLAYER_RADIUS);
      for (let i = 0; i < staticAABBs.length; i++) {
        if (playerBox.intersectsBox(staticAABBs[i])) {
          return true;
        }
      }
      return false;
    }

    function findSafeSpawn() {
      if (!checkPositionCollision(camera.position.x, camera.position.z)) return true;
      const w = roomGroup.userData.width || 6, d = roomGroup.userData.depth || 6;
      for (let z = d / 2 - 0.5; z > -d / 2 + 0.4; z -= 0.4) {
        for (let x = -w / 2 + 0.5; x < w / 2 - 0.4; x += 0.4) {
          if (!checkPositionCollision(x, z)) { camera.position.set(x, PLAYER_HEIGHT, z); return true; }
        }
      }
      // Vị trí cứu cánh an toàn: đặt ở giữa phòng phía sau
      camera.position.set(0, PLAYER_HEIGHT, Math.min(d * 0.25, 1.8));
      return true;
    }

    function moveWithSlidewall(deltaX, deltaZ) {
      const curX = camera.position.x;
      const curZ = camera.position.z;

      // 1. Try moving along both X and Z
      if (!checkPositionCollision(curX + deltaX, curZ + deltaZ)) {
        camera.position.x += deltaX;
        camera.position.z += deltaZ;
        return;
      }
      // 2. Try slidewall along X
      if (!checkPositionCollision(curX + deltaX, curZ)) {
        camera.position.x += deltaX;
        return;
      }
      // 3. Try slidewall along Z
      if (!checkPositionCollision(curX, curZ + deltaZ)) {
        camera.position.z += deltaZ;
        return;
      }
    }

    function updateCrosshairHover() {
      if (navMode !== 'fpv') return;
      const crosshair = document.getElementById('crosshair');
      const crosshairLabel = document.getElementById('crosshair-label');
      if (!crosshair) return;

      raycaster.setFromCamera({ x: 0, y: 0 }, camera);
      raycaster.near = 0.1;
      raycaster.far = 4.0;
      const hits = raycaster.intersectObjects(furnitureMeshes, true);

      if (hits.length > 0 && hits[0].distance <= 3.8) {
        let cur = hits[0].object;
        while (cur && !cur.userData.furnitureInfo && cur.parent) cur = cur.parent;
        if (cur && cur.userData.furnitureInfo) {
          hoveredObject = cur;
          const info = cur.userData.furnitureInfo;
          if (info.isInteractable !== false) {
            crosshair.className = 'interactable';
            if (crosshairLabel && crosshairLabel.style) {
              crosshairLabel.textContent = '✨ ' + (info.label || 'Vật kỷ niệm');
              crosshairLabel.style.display = 'block';
            }
          } else {
            crosshair.className = 'interactable';
            if (crosshairLabel && crosshairLabel.style) {
              crosshairLabel.textContent = '✨ ' + (info.label || 'Đồ vật');
              crosshairLabel.style.display = 'block';
            }
          }
          return;
        }
      }

      hoveredObject = null;
      crosshair.className = '';
      if (crosshairLabel && crosshairLabel.style) crosshairLabel.style.display = 'none';
    }

    function updateFPV(dt) {
      if (navMode !== 'fpv') return;

      // 1. Calculate movement input
      let fwd = moveInput.forward;
      let rgt = moveInput.right;

      if (keysPressed['KeyW'] || keysPressed['ArrowUp']) fwd += 1;
      if (keysPressed['KeyS'] || keysPressed['ArrowDown']) fwd -= 1;
      if (keysPressed['KeyD'] || keysPressed['ArrowRight']) rgt += 1;
      if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) rgt -= 1;

      const len = Math.hypot(fwd, rgt);
      if (len > 0.05) {
        const normFwd = (fwd / Math.max(1, len)) * WALK_SPEED * dt;
        const normRgt = (rgt / Math.max(1, len)) * WALK_SPEED * dt;

        const sinY = Math.sin(fpvYaw);
        const cosY = Math.cos(fpvYaw);

        const deltaX = -sinY * normFwd + cosY * normRgt;
        const deltaZ = -cosY * normFwd - sinY * normRgt;

        moveWithSlidewall(deltaX, deltaZ);

        footstepDistance += Math.hypot(deltaX, deltaZ);
        if (footstepDistance > 1.1) {
          footstepDistance = 0;
          playFootstepAudio();
        }
      }

      // Maintain eye level height
      camera.position.y = PLAYER_HEIGHT;

      // Apply camera rotation
      camera.rotation.order = 'YXZ';
      camera.rotation.y = fpvYaw;
      camera.rotation.x = fpvPitch;
      camera.rotation.z = 0;

      hoverElapsed += dt;
      if (hoverElapsed >= 0.1) { hoverElapsed = 0; updateCrosshairHover(); }
    }

    const hasCanvasSupport = typeof document !== 'undefined' && typeof document.createElement === 'function';
    const hasAudioSupport = typeof window !== 'undefined' && (typeof window.AudioContext !== 'undefined' || typeof window.webkitAudioContext !== 'undefined');

    let audioCtx = null;
    let audioMuted = false;
    let ambientGain = null;
    let footstepDistance = 0;

    function initRoomAudio() {
      if (audioCtx || !hasAudioSupport) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') {
          const resumeAudio = () => {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            window.removeEventListener('pointerdown', resumeAudio);
            window.removeEventListener('keydown', resumeAudio);
          };
          window.addEventListener('pointerdown', resumeAudio);
          window.addEventListener('keydown', resumeAudio);
        }
        setupAmbientSound();
      } catch (e) {
        console.warn('Audio init failed:', e);
      }
    }

    function setupAmbientSound() {
      if (!audioCtx) return;
      try {
        const bufferSize = audioCtx.sampleRate * 2;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
          b6 = white * 0.115926;
        }

        const whiteNoise = audioCtx.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(260, audioCtx.currentTime);

        ambientGain = audioCtx.createGain();
        ambientGain.gain.setValueAtTime(audioMuted ? 0 : 0.08, audioCtx.currentTime);

        whiteNoise.connect(filter);
        filter.connect(ambientGain);
        ambientGain.connect(audioCtx.destination);
        whiteNoise.start(0);
      } catch (e) {}
    }

    function generateVintageTileCanvas(baseColorHex) {
      if (!hasCanvasSupport) return null;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      ctx.fillStyle = '#eae2d3';
      ctx.fillRect(0, 0, 512, 512);

      const accent = baseColorHex || '#2d5442';
      const terracotta = '#994d35';

      ctx.strokeStyle = '#c4b6a3';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 506, 506);

      ctx.strokeStyle = accent;
      ctx.lineWidth = 8;
      ctx.strokeRect(20, 20, 472, 472);

      const corners = [[0, 0], [512, 0], [512, 512], [0, 512]];
      corners.forEach(([cx, cy]) => {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.beginPath();
        ctx.arc(0, 0, 95, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 65, 0, Math.PI * 2);
        ctx.fillStyle = terracotta;
        ctx.fill();
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.fillStyle = '#eae2d3';
        ctx.fill();
        ctx.restore();
      });

      ctx.save();
      ctx.translate(256, 256);
      ctx.beginPath();
      ctx.arc(0, 0, 110, 0, Math.PI * 2);
      ctx.fillStyle = terracotta;
      ctx.fill();

      for (let i = 0; i < 8; i++) {
        ctx.rotate((Math.PI * 2) / 8);
        ctx.beginPath();
        ctx.ellipse(0, 54, 24, 48, 0, 0, Math.PI * 2);
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(0, 48, 10, 28, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#faf8f2';
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fillStyle = '#c89947';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.restore();

      const imgData = ctx.getImageData(0, 0, 512, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const noise = (Math.random() - 0.5) * 16;
        d[i] = Math.min(255, Math.max(0, d[i] + noise));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + noise));
        d[i+2] = Math.min(255, Math.max(0, d[i+2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      return canvas;
    }

    function generateWoodPlanksCanvas(woodHex) {
      if (!hasCanvasSupport) return null;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      ctx.fillStyle = woodHex || '#8B5A2B';
      ctx.fillRect(0, 0, 512, 512);

      const numRows = 8;
      const rowHeight = 512 / numRows;

      for (let r = 0; r < numRows; r++) {
        const y0 = r * rowHeight;
        const xOffset = ((r * 187) % 256);
        const plankLen = 256;

        for (let px = -256 + xOffset; px < 512 + 256; px += plankLen) {
          const shadeShift = ((r * 31 + px) % 17) - 8;
          ctx.fillStyle = shadeShift > 0 ? `rgba(255,255,255,${shadeShift * 0.008})` : `rgba(0,0,0,${-shadeShift * 0.012})`;
          ctx.fillRect(px, y0, plankLen, rowHeight);

          ctx.strokeStyle = 'rgba(0,0,0,0.07)';
          ctx.lineWidth = 1.2;
          for (let gy = y0 + 6; gy < y0 + rowHeight - 4; gy += 6 + (r % 3)) {
            ctx.beginPath();
            ctx.moveTo(px, gy);
            const midY = gy + Math.sin((px + r * 50) * 0.03) * 2;
            ctx.quadraticCurveTo(px + plankLen * 0.5, midY, px + plankLen, gy);
            ctx.stroke();
          }

          ctx.fillStyle = 'rgba(20,10,5,0.45)';
          ctx.fillRect(px, y0, 2.5, rowHeight);

      }

      const imgData = ctx.getImageData(0, 0, 512, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 12;

        d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));

    function generateMarbleCanvas(baseHex) {
      if (!hasCanvasSupport) return null;

        let sy = 0;
        ctx.moveTo(sx, sy);

          const nxtX = sx + (Math.sin(sy * 0.04 + v) * 45) + (Math.random() * 20 - 10);

          ctx.lineTo(nxtX, nxtY);
          sy = nxtY;
          sx = nxtX;
        }
        ctx.stroke();
      }

      const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 320);
      grad.addColorStop(0, 'rgba(255,255,255,0.15)');

    function adjustColorBrightness(hex, percent) {
      hex = (hex || '#888888').replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      let r = (num >> 16) + percent;
      let g = ((num >> 8) & 0x00FF) + percent;
      let b = (num & 0x0000FF) + percent;
      r = Math.max(0, Math.min(255, r));
      g = Math.max(0, Math.min(255, g));
      b = Math.max(0, Math.min(255, b));
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      if (!text) return;
      const limit = maxLines || 4;
      const words = String(text).split(' ');
      let line = '';
      let linesDrawn = 0;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line.trim(), x, y);
          line = words[n] + ' ';
          y += lineHeight;
          linesDrawn++;
          if (linesDrawn >= limit - 1) {
            let remaining = words.slice(n).join(' ');
            while (ctx.measureText(remaining + '...').width > maxWidth && remaining.length > 0) {
              remaining = remaining.slice(0, -1);
            }
            ctx.fillText(remaining + '...', x, y);
            return;
          }
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line.trim(), x, y);
    }

    function generateClassroomTileCanvas(baseHex) {
      if (!hasCanvasSupport) return null;

      ctx.fillRect(0, 0, 512, 512);
      // Gạch 60x60cm bóng gương với đường ron gạch xám mảnh
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.09)';
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, 512, 512);
      // Vân bóng nhẹ & phản chiếu mềm
      const grad = ctx.createLinearGradient(0, 0, 512, 512);
      grad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
      grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.0)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0.03)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      const imgData = ctx.getImageData(0, 0, 512, 512);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 6;
        d[i] = Math.min(255, Math.max(0, d[i] + n));
        d[i+1] = Math.min(255, Math.max(0, d[i+1] + n));
        d[i+2] = Math.min(255, Math.max(0, d[i+2] + n));
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    function createRoutineBadge(text) {
      if (!hasCanvasSupport) return null;
      let displayTime = '🕒 09:00';
      const match = (text || '').match(/(\d{1,2}(?::\d{2}|h(?:\d{2})?))/i);
      if (match) {
        let t = match[1].toLowerCase().replace('h', ':');
        if (!t.includes(':')) t += ':00';
        else if (t.endsWith(':')) t += '00';
        const parts = t.split(':');
        displayTime = '🕒 ' + parts[0].padStart(2, '0') + ':' + (parts[1] || '00').padEnd(2, '0');
      } else if (text && text.length <= 10) {
        displayTime = '🕒 ' + text;
      }

      const canvas = document.createElement('canvas');
      canvas.width = 160;
      canvas.height = 52;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;
      ctx.fillStyle = 'rgba(20, 34, 28, 0.92)';
      if (ctx.roundRect) ctx.roundRect(4, 4, 152, 44, 22); else ctx.fillRect(4, 4, 152, 44);
      ctx.fill();
      ctx.strokeStyle = '#81c784';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(displayTime, 80, 26);
      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const sprite = new THREE.Sprite(mat);
      sprite.name = 'routineBadge';
      sprite.scale.set(0.48, 0.16, 1);
      return sprite;
    }

    function generateOutdoorSkyCanvas() {

      const canvas = document.createElement('canvas');

      if (!ctx) return null;

      // Gradient bầu trời xanh ngọc sáng ban ngày chuẩn nhiếp ảnh
      const grad = ctx.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0, '#1E88E5');
      grad.addColorStop(0.32, '#42A5F5');
      grad.addColorStop(0.62, '#90CAF9');
      grad.addColorStop(0.84, '#E0F2FE');
      grad.addColorStop(1.0, '#FEF9C3');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      // Vầng sáng mặt trời ấm áp và tia sáng lan tỏa (Sunburst flare)
      const sunGrad = ctx.createRadialGradient(380, 110, 8, 380, 110, 220);
      sunGrad.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
      sunGrad.addColorStop(0.2, 'rgba(254, 240, 138, 0.75)');
      sunGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.25)');
      sunGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = sunGrad;
      ctx.fillRect(0, 0, 512, 512);

      // Mây trắng mềm mại tự nhiên
      ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
      ctx.beginPath();
      ctx.arc(130, 170, 48, 0, Math.PI * 2);
      ctx.arc(175, 155, 58, 0, Math.PI * 2);
      ctx.arc(225, 172, 44, 0, Math.PI * 2);
      ctx.arc(265, 185, 34, 0, Math.PI * 2);
      ctx.fill();

      // Hàng cây xanh mát và đồi xa ngoài khung cửa sổ (Outdoor foliage & greenery vista)
      ctx.fillStyle = 'rgba(30, 90, 45, 0.45)';
      for (let x = 0; x < 520; x += 40) {
        ctx.beginPath();
        ctx.arc(x, 460, 55 + Math.sin(x * 0.08) * 16, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#1B4D2E';
      for (let x = -20; x < 530; x += 32) {
        ctx.beginPath();
        ctx.arc(x, 490, 42 + Math.cos(x * 0.12) * 12, 0, Math.PI * 2);
        ctx.fill();
      }

      return canvas;
    }

    function getContactShadowTexture() {
      if (cachedContactShadowTex) return cachedContactShadowTex;
      if (!hasCanvasSupport) return null;
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      if (!ctx) return null;

      const grad = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
      grad.addColorStop(0, 'rgba(12, 16, 14, 0.72)');
      grad.addColorStop(0.35, 'rgba(12, 16, 14, 0.42)');
      grad.addColorStop(0.7, 'rgba(12, 16, 14, 0.15)');
      grad.addColorStop(1.0, 'rgba(12, 16, 14, 0.0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 128, 128);

      cachedContactShadowTex = new THREE.CanvasTexture(canvas);
      return cachedContactShadowTex;
    }

    function addGroundContactShadow(group, w, d, opacity = 0.52) {
      const tex = getContactShadowTexture();
      if (!tex) return;
      const padW = Math.max(0.18, w * 1.08);
      const padD = Math.max(0.18, d * 1.08);
      const geo = new THREE.PlaneGeometry(padW, padD);
      geo.rotateX(-Math.PI / 2);
      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        transparent: true,
        opacity: opacity,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(0, 0.005, 0);
      mesh.renderOrder = 1;
      mesh.userData = { noTexture: true };
      group.add(mesh);
    }

      });

    function materialStyleFromSurface(region, fallback) {
      const material = String(region?.material || '').toLowerCase();
      if (material.includes('vintage')) return 'vintage_tiles';
      if (material.includes('wood') || material.includes('plank')) return 'wood_planks';
