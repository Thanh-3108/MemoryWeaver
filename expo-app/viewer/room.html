    function init() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x18201d);

      const aspect = (window.innerWidth || 400) / (window.innerHeight || 300);
      camera = new THREE.PerspectiveCamera(54, aspect, 0.1, 150);
      camera.position.set(0, 1.55, -2.2);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.setSize(window.innerWidth || 400, window.innerHeight || 300);
      if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.physicallyCorrectLights = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.autoUpdate = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      if (THREE.ACESFilmicToneMapping) {
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.06;
      }
      if (container && container.appendChild) {
        container.appendChild(renderer.domElement);
      }

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enablePan = false;
      controls.enableRotate = !isCameraLocked;
      controls.enableZoom = !isCameraLocked;
      controls.minDistance = 0.45;
      controls.maxDistance = 4.8;
      controls.minPolarAngle = Math.PI * 0.05;
      controls.maxPolarAngle = Math.PI * 0.48;
      controls.target.set(0, 1.25, 0);
      controls.addEventListener('change', () => {
        clampCameraInsideRoom();
        updateWallCutaway();
        applyPopperCam();
        render();
      });

      // 1. Ánh sáng bầu trời và mặt đất (Sky & Ground Ambient Hemisphere Light)
      hemiLight = new THREE.HemisphereLight(0xEDF4FC, 0x221E18, 0.42);
      scene.add(hemiLight);

      // 2. Nguồn sáng chính Mặt trời / Cửa sổ ban ngày (Primary Directional Sun Source)
      sun = new THREE.DirectionalLight(0xFFF6E8, 2.8);
      sun.position.set(9, 16, 7);
      sun.castShadow = true;
      sun.shadow.mapSize.width = 1024;
      sun.shadow.mapSize.height = 1024;
      sun.shadow.bias = -0.0002;
      sun.shadow.radius = 1.2;
      scene.add(sun);

      // 3. Phản xạ gián tiếp từ sàn nhà lên trần (Secondary Floor Radiosity Diffuse Bounce)
      bounceLight = new THREE.DirectionalLight(0xE8D5B7, 0.30);
      bounceLight.position.set(0, -2, 0);
      bounceLight.target.position.set(0, 3, 0);
      scene.add(bounceLight);
      scene.add(bounceLight.target);

      // 4. Ánh sáng tán xạ môi trường mát dịu (Soft Ambient Fill Light)
      fillLight = new THREE.DirectionalLight(0xD8E6F5, 0.20);
      fillLight.position.set(-8, 11, -8);
      scene.add(fillLight);

      window.addEventListener('resize', onWindowResize);
      if (renderer.domElement && renderer.domElement.addEventListener) {
        renderer.domElement.addEventListener('pointerdown', onPointerDown);
        renderer.domElement.addEventListener('pointerup', onPointerUp);
        renderer.domElement.addEventListener('mousedown', onMouseDown);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
      window.addEventListener('blur', () => { moveInput.forward = moveInput.right = 0; Object.keys(keysPressed).forEach(k => delete keysPressed[k]); isMouseDown = false; fpvTouchId = null; });
      window.addEventListener('keydown', onKeyDown);
      window.addEventListener('keyup', onKeyUp);

      setupVirtualJoystick();
      setupFpvTouchLook();

      document.addEventListener?.('visibilitychange', () => setActivity(appActive));
      render();
      window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'READY' }));
    }

    function onKeyDown(e) {
      if (['KeyW', 'KeyS', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        keysPressed[e.code] = true;
      }
    }
    function onKeyUp(e) {
      if (keysPressed[e.code]) {
        keysPressed[e.code] = false;
      }
    }
    function onMouseDown(e) {
      if (navMode === 'fpv' && !isCameraLocked && e.button === 0) {
        isMouseDown = true;
        prevMousePos = { x: e.clientX, y: e.clientY };
      }
    }
    function onMouseMove(e) {
      if (navMode === 'fpv' && !isCameraLocked && isMouseDown) {
        const dx = e.clientX - prevMousePos.x;
        const dy = e.clientY - prevMousePos.y;
        fpvYaw -= dx * 0.0035;
        fpvPitch = Math.max(-1.3, Math.min(1.3, fpvPitch - dy * 0.0035));
        prevMousePos = { x: e.clientX, y: e.clientY };
      }
    }
    function onMouseUp() {
      isMouseDown = false;
    }

    function setupVirtualJoystick() {
      const zone = document.getElementById('joystick-zone');
      const stick = document.getElementById('joystick-stick');
      if (!zone || !stick || typeof zone.addEventListener !== 'function') return;

      let stickTouchId = null;
      let center = { x: 0, y: 0 };
      const maxRadius = 46;

      zone.addEventListener('touchstart', e => {
        if (!e.changedTouches || e.changedTouches.length === 0) return;
        const touch = e.changedTouches[0];
        stickTouchId = touch.identifier;
        const rect = (typeof zone.getBoundingClientRect === 'function') ? zone.getBoundingClientRect() : { left: 0, top: 0, width: 120, height: 120 };
        center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
        updateStick(touch.clientX, touch.clientY);
        if (e.preventDefault) e.preventDefault();
      }, { passive: false });

      if (typeof window.addEventListener === 'function') {
        window.addEventListener('touchmove', e => {
          if (stickTouchId === null || !e.changedTouches) return;
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === stickTouchId) {
              updateStick(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
              break;
            }
          }
        }, { passive: false });

        const onEnd = e => {
          if (stickTouchId === null || !e.changedTouches) return;
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === stickTouchId) {
              stickTouchId = null;
              moveInput.forward = 0;
              moveInput.right = 0;
              if (stick && stick.style) stick.style.transform = 'translate(-50%, -50%)';
              break;
            }
          }
        };
        window.addEventListener('touchend', onEnd);
        window.addEventListener('touchcancel', onEnd);
      }

      function updateStick(cx, cy) {
        const dx = cx - center.x;
        const dy = cy - center.y;
        const dist = Math.hypot(dx, dy);
        const clampedDist = Math.min(dist, maxRadius);
        const angle = Math.atan2(dy, dx);
        const stickX = Math.cos(angle) * clampedDist;
        const stickY = Math.sin(angle) * clampedDist;
        if (stick && stick.style) stick.style.transform = `translate(calc(-50% + ${stickX}px), calc(-50% + ${stickY}px))`;

        moveInput.right = stickX / maxRadius;
        moveInput.forward = -stickY / maxRadius;
      }
    }

    function setupFpvTouchLook() {
      if (typeof window.addEventListener !== 'function') return;
      const zone = document.getElementById('joystick-zone');
      window.addEventListener('touchstart', e => {
        if (navMode !== 'fpv' || isCameraLocked || !e.changedTouches) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (zone && typeof zone.contains === 'function' && zone.contains(t.target)) continue;
          if (fpvTouchId === null) {
            fpvTouchId = t.identifier;
            fpvTouchPrevPos = { x: t.clientX, y: t.clientY };
            break;
          }
        }
      });

      window.addEventListener('touchmove', e => {
        if (navMode !== 'fpv' || isCameraLocked || fpvTouchId === null || !e.changedTouches) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          const t = e.changedTouches[i];
          if (t.identifier === fpvTouchId) {
            const dx = t.clientX - fpvTouchPrevPos.x;
            const dy = t.clientY - fpvTouchPrevPos.y;
            fpvYaw -= dx * 0.005;
            fpvPitch = Math.max(-1.3, Math.min(1.3, fpvPitch - dy * 0.005));
            fpvTouchPrevPos = { x: t.clientX, y: t.clientY };
            break;
          }
        }
      });

      const onTouchEnd = e => {
        if (fpvTouchId === null || !e.changedTouches) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
          if (e.changedTouches[i].identifier === fpvTouchId) {
            fpvTouchId = null;
            break;
          }
        }
      };
      window.addEventListener('touchend', onTouchEnd);
      window.addEventListener('touchcancel', onTouchEnd);
    }

    function scheduleFrame() {
      if (frameId === null && appActive && !document.hidden && roomGroup && typeof requestAnimationFrame === 'function') frameId = requestAnimationFrame(animate);
    }
    function setActivity(active) {
      appActive = active;
      lastFrameTime = 0;
      if (!active || document.hidden) {
        if (frameId !== null && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(frameId);
        frameId = null;
        if (camAnimId !== null && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(camAnimId);
        camAnimId = null;
        moveInput.forward = moveInput.right = 0;
        Object.keys(keysPressed).forEach(k => delete keysPressed[k]);
        fpvTouchId = null; isMouseDown = false;
      } else { scheduleFrame(); render(); }
    }
    window.setAppActive = setActivity;
    function animate(time) {
      frameId = null;
      if (!appActive || document.hidden || !roomGroup) { lastFrameTime = 0; return; }
      const t = typeof time === 'number' ? time : (typeof performance !== 'undefined' ? performance.now() : Date.now());
      const dt = lastFrameTime ? Math.min(0.08, (t - lastFrameTime) / 1000) : 0.016;
      lastFrameTime = t;

      let hasContinuousAnim = false;
      if (furnitureMeshes && furnitureMeshes.length > 0) {
        for (let i = 0; i < furnitureMeshes.length; i++) {
          const fm = furnitureMeshes[i];
          if (fm.userData?.isFanOn && fm.userData?.bladeGroup) {
            fm.userData.bladeGroup.rotation.z += 0.35;
            hasContinuousAnim = true;
          }
        }
      }

      if (navMode === 'fpv') {
        updateFPV(dt);
        render();
      } else if (controls && controls.enabled && controls.enableDamping) {
        if (controls.update()) scheduleFrame();
      } else if (hasContinuousAnim) {
        render();
      }
      if (hasContinuousAnim) {
        scheduleFrame();
      }
    }

    function onWindowResize() {
      if (!renderer || !camera) return;
      const aspect = (window.innerWidth || 400) / (window.innerHeight || 300);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth || 400, window.innerHeight || 300);
      if (navMode !== 'fpv' && !isFocusedPov && roomGroup) {
        fitCameraToRoom();
      }
      render();
    }

    function onPointerDown(e) {
      if (!audioCtx) initRoomAudio();
      touchStartTime = Date.now();
      touchStartPos = { x: e.clientX, y: e.clientY };
    }

    let bubbleTimer = null;
    function showRestrictedDialogue(text) {
      const overlay = document.getElementById('bubble-overlay');
      const bubbleText = document.getElementById('bubble-text');
      if (!overlay || !bubbleText) return;
      bubbleText.textContent = text;
      if (overlay && overlay.style) overlay.style.display = 'flex';
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => {
        if (overlay && overlay.style) overlay.style.display = 'none';
      }, 4200);
    }

    let activeFocusedFurniture = null;

    function onPointerUp(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      const clientX = (e.clientX !== undefined) ? e.clientX : (e.changedTouches && e.changedTouches[0]?.clientX);
      const clientY = (e.clientY !== undefined) ? e.clientY : (e.changedTouches && e.changedTouches[0]?.clientY);
      const dt = Date.now() - touchStartTime;
      const dist = Math.hypot((clientX || 0) - touchStartPos.x, (clientY || 0) - touchStartPos.y);

      if (dt < 650 && dist < 28) {
        if (navMode === 'fpv') {
          let targetObj = hoveredObject;
          if (!targetObj) {
            raycaster.setFromCamera({ x: 0, y: 0 }, camera);
            raycaster.near = 0.1;
            raycaster.far = 4.0;
            const hits = raycaster.intersectObjects(furnitureMeshes, true);
            if (hits.length > 0 && hits[0].distance <= 3.8) {
              let cur = hits[0].object;
              while (cur && !cur.userData?.furnitureInfo && cur.parent) cur = cur.parent;
              targetObj = cur;
            }
          }
          if (targetObj && targetObj.userData?.furnitureInfo) {
            const info = targetObj.userData.furnitureInfo;
            if (activeFocusedFurniture === targetObj) {
              if (targetObj.userData?.toggleBook) { targetObj.userData.toggleBook(); return; }
              if (targetObj.userData?.flipPicture) { targetObj.userData.flipPicture(); return; }
              if (targetObj.userData?.toggleDrawer) { targetObj.userData.toggleDrawer(); return; }
              if (targetObj.userData?.toggleDoors) { targetObj.userData.toggleDoors(); return; }
              if (targetObj.userData?.toggleLamp) { targetObj.userData.toggleLamp(); return; }
              if (targetObj.userData?.toggleFridge) { targetObj.userData.toggleFridge(); return; }
              if (targetObj.userData?.toggleCabinet) { targetObj.userData.toggleCabinet(); return; }
              if (targetObj.userData?.toggleTv) { targetObj.userData.toggleTv(); return; }
              if (targetObj.userData?.toggleFan) { targetObj.userData.toggleFan(); return; }
              if (targetObj.userData?.toggleAirConditioner) { targetObj.userData.toggleAirConditioner(); return; }
              if (targetObj.userData?.sitOnSofa) { targetObj.userData.sitOnSofa(); return; }
              if (targetObj.userData?.sitOnChair) { targetObj.userData.sitOnChair(); return; }
              if (targetObj.userData?.pourDrink) { targetObj.userData.pourDrink(); return; }
              if (targetObj.userData?.waterPlant) { targetObj.userData.waterPlant(); return; }
              if (targetObj.userData?.chimeClock) { targetObj.userData.chimeClock(); return; }
              if (targetObj.userData?.toggleCurtains) { targetObj.userData.toggleCurtains(); return; }
            }
            highlightFurniture(targetObj);
            playInteractChime();
            activeFocusedFurniture = targetObj;
            if (info.kind === 'door' || info.targetRoomId || info.interaction?.type === 'door_transition') {
              window.ReactNativeWebView?.postMessage(JSON.stringify({
                type: 'DOOR_TRANSITION',
                targetRoomId: info.targetRoomId || info.interaction?.targetRoomId,
                label: info.label
              }));
            }
            window.ReactNativeWebView?.postMessage(JSON.stringify({
              type: 'SELECT_FURNITURE',
              label: info.label,
              description: info.description,
              routineLabel: info.routineLabel,
              isInteractable: true,
              item: info
            }));
            return;
          }

          // Tap-to-walk on floor in FPV
          if (floorMesh) {
            mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const floorHits = raycaster.intersectObject(floorMesh, false);
            if (floorHits.length > 0) {
              const hit = floorHits[0].point;
              if (!checkPositionCollision(hit.x, hit.z)) {
                const targetPos = new THREE.Vector3(hit.x, PLAYER_HEIGHT, hit.z);
                const lookDist = 2.0;
                const sinY = Math.sin(fpvYaw);
                const cosY = Math.cos(fpvYaw);
                const targetLook = new THREE.Vector3(hit.x - sinY * lookDist, PLAYER_HEIGHT, hit.z - cosY * lookDist);
                glidePlayerInFpv(targetPos, targetLook);
                return;
              }
            }
          }
          return;
        }

        // Point-and-Explore 3D Selection
        mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(furnitureMeshes, true);
        if (intersects.length > 0) {
          let hitObj = intersects[0].object;

          // 1. Tapping an individual sub-book on the shelf pulls it forward!
          if (hitObj.userData?.isSubBook) {
            pullOutBookFromShelf(hitObj);
            return;
          }

          let cur = hitObj;
          if (cur.userData?.isHitProxy && cur.userData.parentGroup) {
            cur = cur.userData.parentGroup;
          } else if (cur.userData?.parentFurnitureGroup) {
            cur = cur.userData.parentFurnitureGroup;
          } else {
            while (cur && !cur.userData?.furnitureInfo && cur.parent) cur = cur.parent;
          }

          if (cur && cur.userData?.furnitureInfo) {
            const info = cur.userData.furnitureInfo;

            // 2. Tactile interaction if clicking already focused furniture:
            if (activeFocusedFurniture === cur) {
              if (cur.userData?.toggleBook) { cur.userData.toggleBook(); return; }
              if (cur.userData?.flipPicture) { cur.userData.flipPicture(); return; }
              if (cur.userData?.toggleDrawer) { cur.userData.toggleDrawer(); return; }
              if (cur.userData?.toggleDoors) { cur.userData.toggleDoors(); return; }
              if (cur.userData?.toggleDoor) { cur.userData.toggleDoor(); return; }
              if (cur.userData?.toggleLamp) { cur.userData.toggleLamp(); return; }
              if (cur.userData?.toggleFridge) { cur.userData.toggleFridge(); return; }
              if (cur.userData?.toggleCabinet) { cur.userData.toggleCabinet(); return; }
              if (cur.userData?.toggleTv) { cur.userData.toggleTv(); return; }
              if (cur.userData?.toggleFan) { cur.userData.toggleFan(); return; }
              if (cur.userData?.toggleAirConditioner) { cur.userData.toggleAirConditioner(); return; }
              if (cur.userData?.sitOnSofa) { cur.userData.sitOnSofa(); return; }
              if (cur.userData?.sitOnChair) { cur.userData.sitOnChair(); return; }
              if (cur.userData?.pourDrink) { cur.userData.pourDrink(); return; }
              if (cur.userData?.waterPlant) { cur.userData.waterPlant(); return; }
              if (cur.userData?.chimeClock) { cur.userData.chimeClock(); return; }
              if (cur.userData?.toggleCurtains) { cur.userData.toggleCurtains(); return; }
            }

            // VÙNG TƯƠNG TÁC (Tất cả đồ vật đều phản hồi tương tác mượt mà)
            highlightFurniture(cur);
            playInteractChime();
            focusOnFurniture(cur);
            if (info.kind === 'door' || info.targetRoomId || info.interaction?.type === 'door_transition') {
              window.ReactNativeWebView?.postMessage(JSON.stringify({
                type: 'DOOR_TRANSITION',
                targetRoomId: info.targetRoomId || info.interaction?.targetRoomId,
                label: info.label
              }));
            }
            window.ReactNativeWebView?.postMessage(JSON.stringify({
              type: 'SELECT_FURNITURE',
              label: info.label,
              description: info.description,
              routineLabel: info.routineLabel,
              isInteractable: true,
              item: info
            }));
            return;
          }
        }

        // 0. Kiểm tra chạm vào 4 mép màn hình để xoay / ngửa góc nhìn (Edge Tap Turn & Tilt)
        // Ưu tiên chọn đồ vật trước: chỉ khi không chạm trúng đồ vật mới kích hoạt xoay ở mép viền
        const edgeThreshX = Math.max(48, Math.min(rect.width * 0.16, 75));
        const edgeThreshY = Math.max(42, Math.min(rect.height * 0.14, 65));
        const dLeft = clientX - rect.left;
        const dRight = rect.right - clientX;
        const dTop = clientY - rect.top;
        const dBottom = rect.bottom - clientY;

        const isLeftEdge = dLeft >= 0 && dLeft <= edgeThreshX;
        const isRightEdge = dRight >= 0 && dRight <= edgeThreshX;
        const isTopEdge = dTop >= 0 && dTop <= edgeThreshY;
        const isBottomEdge = dBottom >= 0 && dBottom <= edgeThreshY;

        if (isLeftEdge || isRightEdge || isTopEdge || isBottomEdge) {
          const minDist = Math.min(
            isLeftEdge ? dLeft : Infinity,
            isRightEdge ? dRight : Infinity,
            isTopEdge ? dTop : Infinity,
            isBottomEdge ? dBottom : Infinity
          );

          if (minDist === dLeft) {
            window.rotateView('left');
            return;
          } else if (minDist === dRight) {
            window.rotateView('right');
            return;
          } else if (minDist === dTop) {
            window.rotateView('up');
            return;
          } else if (minDist === dBottom) {
            window.rotateView('down');
            return;
          }
        }

        // 1. Kiểm tra bấm vào Tường (Wall click / tap)
        const wallHits = (wallMeshes && wallMeshes.length > 0) ? raycaster.intersectObjects(wallMeshes, false) : [];
        if (wallHits.length > 0) {
          const hit = wallHits[0].point;
          const rw = ((roomGroup?.userData?.width || 6) * 0.5) - 0.75;
          const rd = ((roomGroup?.userData?.depth || 6) * 0.5) - 0.75;

          // Bay đến vị trí gần bức tường đó nhưng cách tường một khoảng hợp lý để đứng quan sát
          const camX = Math.max(-rw, Math.min(rw, hit.x));
          const camZ = Math.max(-rd, Math.min(rd, hit.z));
          const camPos = new THREE.Vector3(camX, PLAYER_HEIGHT, camZ);

          // Hướng nhìn: quay lưng vào tường, phóng tầm mắt bao quát toàn bộ căn phòng và các đồ vật
          const toCenterX = -camX;
          const toCenterZ = -camZ;
          const distToCenter = Math.hypot(toCenterX, toCenterZ) || 1;
          const targetLook = new THREE.Vector3(
            camX + (toCenterX / distToCenter) * 3.6,
            1.22,
            camZ + (toCenterZ / distToCenter) * 3.6
          );

          playInteractChime();
          isFocusedPov = false;
          activeFocusedFurniture = null;
          if (typeof clearFurnitureHighlight === 'function') clearFurnitureHighlight();
          lastStableVantage = { pos: camPos.clone(), look: targetLook.clone() };

          animateCameraTo(camPos, targetLook, 2.5, () => {
            if (controls) {
              controls.target.copy(targetLook);
              controls.update();
            }
            window.ReactNativeWebView?.postMessage(JSON.stringify({
              type: 'POV_STATE',
              mode: 'wall_view',
              label: 'Quan sát từ vách tường'
            }));
          });
          return;
        }

        // 2. Kiểm tra bấm vào Sàn nhà (Floor click / tap)
        if (floorMesh) {
          const floorHits = raycaster.intersectObject(floorMesh, false);
          if (floorHits.length > 0) {
            const hit = floorHits[0].point;
            const rw = ((roomGroup?.userData?.width || 6) * 0.5) - 0.55;
            const rd = ((roomGroup?.userData?.depth || 6) * 0.5) - 0.55;

            // Bay đến vị trí sàn nhà đó ở độ cao tầm mắt
            const camX = Math.max(-rw, Math.min(rw, hit.x));
            const camZ = Math.max(-rd, Math.min(rd, hit.z));
            const camPos = new THREE.Vector3(camX, PLAYER_HEIGHT, camZ);

            // Hướng nhìn: bao quát xung quanh thay vì úp vào góc tường
            const toCenterX = -camX;
            const toCenterZ = -camZ;
            const distToCenter = Math.hypot(toCenterX, toCenterZ);
            let targetLook;
            if (distToCenter < 0.6) {
              targetLook = new THREE.Vector3(0, 1.22, rd * 0.7);
            } else {
              targetLook = new THREE.Vector3(
                camX + (toCenterX / distToCenter) * 3.2,
                1.22,
                camZ + (toCenterZ / distToCenter) * 3.2
              );
            }

            playInteractChime();
            isFocusedPov = false;
            activeFocusedFurniture = null;
            if (typeof clearFurnitureHighlight === 'function') clearFurnitureHighlight();
            lastStableVantage = { pos: camPos.clone(), look: targetLook.clone() };

            animateCameraTo(camPos, targetLook, 2.5, () => {
              if (controls) {
                controls.target.copy(targetLook);
                controls.update();
              }
              window.ReactNativeWebView?.postMessage(JSON.stringify({
                type: 'POV_STATE',
                mode: 'floor_view',
                label: 'Vị trí quan sát sàn phòng'
              }));
            });
            playFootstepAudio();
            return;
          }
        }
      }
    }

    function fitCameraToRoom() {
      if (!roomGroup) return { overviewPos: new THREE.Vector3(0, 1.55, -2.2), overviewLook: new THREE.Vector3(0, 1.15, 0.5) };
      const w = roomGroup.userData?.width || 6;
      const d = roomGroup.userData?.depth || 6;
      const h = roomGroup.userData?.height || 3;
      const aspect = (window.innerWidth || 400) / (window.innerHeight || 300);

      // Góc nhìn nội thất tự nhiên: đứng ở cửa phòng nhìn vào không gian ấm cúng
      const overviewPos = new THREE.Vector3(0, 1.55, -d * 0.5 + 0.85);
      const overviewLook = new THREE.Vector3(0, 1.15, d * 0.15);

      desiredOrbitDistance = 2.5;

      camera.aspect = aspect;
      camera.position.copy(overviewPos);
      camera.lookAt(overviewLook);
      camera.updateProjectionMatrix();

      if (controls) {
        controls.target.copy(overviewLook);
        controls.update();
      }

      updateWallCutaway();
      return { overviewPos, overviewLook };
    }

    
    function clampCameraInsideRoom() {
      if (!roomGroup) return;
      const rw = ((roomGroup.userData?.width || 6) * 0.5) - 0.45;
      const rd = ((roomGroup.userData?.depth || 6) * 0.5) - 0.45;
      const rh = (roomGroup.userData?.height || 3.0) - 0.35;
      camera.position.x = Math.max(-rw, Math.min(rw, camera.position.x));
      camera.position.y = Math.max(1.15, Math.min(rh, camera.position.y));
      camera.position.z = Math.max(-rd, Math.min(rd, camera.position.z));
    }
    function applyPopperCam() {
      // In overview / dollhouse mode, do not squash camera into walls!
      if (navMode !== 'fpv' || isAdjustingPopper || !roomGroup || wallMeshes.length === 0 || !controls) return;

      const target = controls.target;
      const offset = new THREE.Vector3().subVectors(camera.position, target);
      const currentDist = offset.length();
      if (currentDist < 0.1) return;

      const dir = offset.clone().normalize();
      const testDist = Math.max(desiredOrbitDistance, currentDist);

      raycaster.set(target, dir);
      raycaster.near = 0.05;
      raycaster.far = testDist + 0.5;

      const hits = raycaster.intersectObjects(wallMeshes, false);
      let targetDist = testDist;
      if (hits.length > 0 && hits[0].distance < testDist) {
        // Dính tường -> Block vision, đẩy camera vào mặt trong của tường (Roblox PopperCam)
        targetDist = Math.max(0.45, hits[0].distance - 0.18);
      } else {
        desiredOrbitDistance = currentDist;
      }

      if (Math.abs(currentDist - targetDist) > 0.02) {
        isAdjustingPopper = true;
        camera.position.copy(target).addScaledVector(dir, targetDist);
        camera.updateMatrixWorld();
        isAdjustingPopper = false;
      }
    }

    function pullOutBookFromShelf(subBook) {
      if (!subBook || !subBook.userData?.parentShelf) return;
      playDrawerSlideSound();

      const targetZ = subBook.userData.isPulledOut ? subBook.userData.baseZ : subBook.userData.baseZ - 0.32;
      subBook.userData.isPulledOut = !subBook.userData.isPulledOut;

      const startZ = subBook.position.z;
      const startTime = performance.now();
      const dur = 340;

      function stepPull() {
        const elapsed = performance.now() - startTime;
        const p = Math.min(1, elapsed / dur);
        const ease = p < 0.5 ? 2 * p * p : -1 + (4 - 2 * p) * p;
        subBook.position.z = startZ + (targetZ - startZ) * ease;
        render();
        if (p < 1) requestAnimationFrame(stepPull);
      }
      stepPull();

      highlightFurniture(subBook);
      playPageFlipSound();
      focusOnFurniture(subBook);

      const title = subBook.userData.title || 'Cuốn sách';
      const pages = subBook.userData.pages || ['Trang sách chứa đựng những dòng ký ức thân thương.'];
      window.ReactNativeWebView?.postMessage(JSON.stringify({
        type: 'SELECT_FURNITURE',
        label: title,
        description: 'Cuốn sách "' + title + '" được rút ra từ giá sách gia đình.',
        routineLabel: 'Đọc lại trang sách kỷ niệm',
        isInteractable: true,
        item: {
          id: 'shelf_book_' + Date.now(),
          label: title,
          kind: 'book',
          description: 'Cuốn sách "' + title + '" chứa đựng những dòng ký ức thân thương.',
          interaction: {
            type: 'book_read',
            bookTitle: title,
            pages: pages
          }
        }
      }));
    }

    function findBestVantagePoint(group) {
      if (!roomGroup || !group) return { camPos: camera.position.clone(), targetLook: new THREE.Vector3(0, 1.2, 0), dist: 2.0 };

      const w = roomGroup.userData?.width || 6;
      const d = roomGroup.userData?.depth || 6;
      const h = roomGroup.userData?.height || 3;
      const rw = ((w * 0.5) - 0.45);
      const rd = ((d * 0.5) - 0.45);

      const info = group.userData?.furnitureInfo || {};
      const kind = info.kind || '';

      // Tọa độ tâm thế giới của đồ vật
      const worldPos = new THREE.Vector3();
      group.getWorldPosition(worldPos);

      // Kích thước chuẩn & Bounding Box thực tế
      const aabb = new THREE.Box3().setFromObject(group);
      const size = new THREE.Vector3();
      aabb.getSize(size);
      const fw = Math.max(0.35, size.x);
      const fh = Math.max(0.3, size.y);
      const fd = Math.max(0.35, size.z);
      const horizRadius = Math.max(fw, fd) * 0.5;

      // Hướng tâm từ đồ vật về trung tâm lòng phòng (0, 0, 0)
      let toRoomCenter = new THREE.Vector3(-worldPos.x, 0, -worldPos.z);
      if (toRoomCenter.lengthSq() < 0.04) {
        toRoomCenter.set(0, 0, 1);
      } else {
        toRoomCenter.normalize();
      }

      // 1. Sách / Vở / Nhật ký: Góc nhìn đọc sách gần gũi, bao quát cả 2 trang mở trên mặt bàn
      if (kind === 'book' || kind === 'notebook' || group.userData?.isBook) {
        const readLook = new THREE.Vector3(worldPos.x, aabb.max.y + 0.02, worldPos.z);
        const readDist = 0.58;
        const camPos = new THREE.Vector3(
          worldPos.x + toRoomCenter.x * 0.36,
          aabb.max.y + 0.38,
          worldPos.z + toRoomCenter.z * 0.36
        );
        return { camPos, targetLook: readLook, dist: readDist };
      }

      // Điểm camera hướng nhìn đến:
      let targetLook = new THREE.Vector3(
        worldPos.x,
        Math.max(0.4, aabb.min.y + fh * 0.52),
        worldPos.z
      );

      // Vector hướng nhìn chuẩn (Viewing direction from object to camera)
      // Mặc định luôn đứng ở lòng phòng nhìn vào đồ vật
      let viewDir = toRoomCenter.clone();

      if (kind === 'television' || kind === 'tv') {
        const frontDir = new THREE.Vector3(0, 0, -1);
        group.updateMatrixWorld(true);
        frontDir.applyQuaternion(group.getWorldQuaternion(new THREE.Quaternion()));
        frontDir.y = 0;
        if (frontDir.lengthSq() > 0.01 && frontDir.dot(toRoomCenter) >= -0.25) {
          viewDir.copy(frontDir.normalize());
        }
      } else if (kind === 'wardrobe' || kind === 'cabinet') {
        const frontDir = new THREE.Vector3(0, 0, -1);
        group.updateMatrixWorld(true);
        frontDir.applyQuaternion(group.getWorldQuaternion(new THREE.Quaternion()));
        frontDir.y = 0;
        if (frontDir.lengthSq() > 0.01 && frontDir.dot(toRoomCenter) >= -0.25) {
          viewDir.copy(frontDir.normalize());
        }
      } else if (kind === 'desk' || kind === 'table') {
        targetLook.y = aabb.min.y + fh * 0.65;
      } else if (kind === 'sofa' || kind === 'bed') {
        targetLook.y = Math.max(0.45, aabb.min.y + fh * 0.42);
      } else if (kind === 'plant') {
        targetLook.y = aabb.min.y + fh * 0.55;
      }

      // Cự ly an toàn (Clearance distance): TUYỆT ĐỐI không chui vào vật thể
      let clearance = 1.35;
      let camHeight = 1.45;

      if (kind === 'sofa') {
        clearance = Math.max(1.65, fw * 0.85); // Đứng lùi xa đủ thấy toàn bộ ghế sofa êm ái
        camHeight = Math.max(1.4, targetLook.y + 0.65);
      } else if (kind === 'bed') {
        clearance = Math.max(1.6, Math.max(fw, fd) * 0.8);
        camHeight = Math.max(1.4, targetLook.y + 0.6);
      } else if (kind === 'plant') {
        clearance = 1.35; // Đứng lùi 1.35m ngoài tán lá
        camHeight = Math.max(1.35, aabb.max.y + 0.35); // Góc nhìn từ trên cao xuống tán lá và chậu cây
      } else if (kind === 'television' || kind === 'tv') {
        clearance = Math.max(1.85, fw * 1.5);
        camHeight = Math.max(1.35, targetLook.y);
      } else if (kind === 'wardrobe' || kind === 'cabinet') {
        clearance = Math.max(1.65, Math.max(fw, fh) * 0.95);
        camHeight = Math.min(1.6, aabb.min.y + fh * 0.6);
      } else if (kind === 'desk' || kind === 'table') {
        clearance = Math.max(1.45, fw * 0.9);
        camHeight = Math.max(1.4, aabb.max.y + 0.5);
      } else if (kind === 'picture') {
        clearance = 1.45;
        camHeight = targetLook.y;
      } else {
        clearance = Math.max(1.2, Math.min(2.0, horizRadius * 1.5));
        camHeight = Math.max(1.25, Math.min(1.65, targetLook.y + 0.3));
      }

      const totalDist = horizRadius + clearance;
      let candPos = new THREE.Vector3(
        worldPos.x + viewDir.x * totalDist,
        camHeight,
        worldPos.z + viewDir.z * totalDist
      );

      // Nếu candPos vượt quá tường phòng (do phòng nhỏ), lùi dần nhưng KHÔNG BAO GIỜ gần hơn horizRadius + 0.65m
      const minSafeDist = horizRadius + 0.65;
      if (candPos.x < -rw || candPos.x > rw || candPos.z < -rd || candPos.z > rd) {
        let fitDist = totalDist;
        let foundFit = false;
        while (fitDist >= minSafeDist) {
          fitDist -= 0.12;
          const testX = worldPos.x + viewDir.x * fitDist;
          const testZ = worldPos.z + viewDir.z * fitDist;
          if (testX >= -rw && testX <= rw && testZ >= -rd && testZ <= rd) {
            candPos.x = testX;
            candPos.z = testZ;
            foundFit = true;
            break;
          }
        }
        if (!foundFit) {
          const testAngles = [Math.PI * 0.2, -Math.PI * 0.2, Math.PI * 0.35, -Math.PI * 0.35];
          for (const angle of testAngles) {
            const rotDir = viewDir.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), angle).normalize();
            const testX = worldPos.x + rotDir.x * minSafeDist;
            const testZ = worldPos.z + rotDir.z * minSafeDist;
            if (testX >= -rw && testX <= rw && testZ >= -rd && testZ <= rd) {
              candPos.x = testX;
              candPos.z = testZ;
              foundFit = true;
              break;
            }
          }
        }
      }

      // Chốt chặn tuyệt đối: candPos luôn ở bên trong phòng
      candPos.x = Math.max(-rw, Math.min(rw, candPos.x));
      candPos.z = Math.max(-rd, Math.min(rd, candPos.z));
      candPos.y = Math.max(0.85, Math.min(h - 0.3, candPos.y));

      // Kiểm tra va chạm AABB: nếu candPos lọt vào bên trong khối đồ vật + 35cm lề
      const safeAABB = aabb.clone().expandByScalar(0.35);
      if (safeAABB.containsPoint(candPos)) {
        candPos.x = worldPos.x + toRoomCenter.x * (horizRadius + 0.65);
        candPos.z = worldPos.z + toRoomCenter.z * (horizRadius + 0.65);
        candPos.y = Math.max(camHeight, aabb.max.y + 0.35);
      }

      return { camPos: candPos, targetLook, dist: totalDist };
    }

    function focusOnFurniture(group) {
      if (!roomGroup || !group) return;

      activeFocusedFurniture = group;
      if (!isFocusedPov) {
        lastStableVantage = {
          pos: camera.position.clone(),
          look: controls ? controls.target.clone() : new THREE.Vector3(0, 1.15, 0)
        };
      }

      // Tự động mở sách 3D khi chạm vào sách hoặc vở nhật ký
      if (group.userData?.isBook) {
        if (!group.userData.isBookOpen && group.userData.openBook) {
          group.userData.openBook(true);
        } else if (!group.userData.isBookOpen && group.userData.toggleBook) {
          group.userData.toggleBook();
        }
      }

      if (navMode === 'fpv' && !isCameraLocked) {
        const targetWorldPos = new THREE.Vector3();
        group.getWorldPosition(targetWorldPos);
        const dx = targetWorldPos.x - camera.position.x;
        const dz = targetWorldPos.z - camera.position.z;
        fpvYaw = Math.atan2(-dx, -dz);
        fpvPitch = -0.15;
        render();
        return;
      }

      isFocusedPov = true;
      const btn = document.getElementById('btn-back-overview');
      const hint = document.getElementById('pov-hint-badge');
      if (btn && btn.style) btn.style.display = 'block';
      if (hint && hint.style) {
        hint.style.display = 'block';
        hint.textContent = isCameraLocked
          ? '✨ Đang khám phá: ' + (group.userData?.furnitureInfo?.label || group.userData?.title || 'đồ vật') + ' • Chạm lần nữa để tương tác 3D'
          : '👁️ Đang ngắm: ' + (group.userData?.furnitureInfo?.label || group.userData?.title || 'đồ vật') + ' • Kéo để xoay quanh vật thể';
      }

      // Hide floating badges in focused POV mode so view is clean
      roomGroup.traverse(child => {
        if (child.name === 'routineBadge' || child.name === 'explorePin') child.visible = false;
      });

      const { camPos, targetLook, dist } = findBestVantagePoint(group);

      animateCameraTo(camPos, targetLook, dist, () => {
        if (controls) {
          controls.enableRotate = !isCameraLocked;
          controls.enableZoom = !isCameraLocked;
          controls.enablePan = false;
          controls.minPolarAngle = Math.PI * 0.05;
          controls.maxPolarAngle = Math.PI * 0.48;
        }
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'POV_STATE',
          mode: 'focused',
          label: group.userData?.furnitureInfo?.label || group.userData?.title
        }));
      });
    }

    let hotspotMeshes = [];

    function createHotspotDisk(info) {
      if (!roomGroup) return;
      const hsGroup = new THREE.Group();
      hsGroup.position.set(info.x, 0.026, info.z);

      // Inner disc
      const diskGeo = new THREE.RingGeometry(0.06, 0.38, 32);
      const diskMat = new THREE.MeshBasicMaterial({
        color: 0x34d399,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide
      });
      const disk = new THREE.Mesh(diskGeo, diskMat);
      disk.rotation.x = -Math.PI / 2;
      hsGroup.add(disk);

      // Outer pulse ring
      const pulseGeo = new THREE.RingGeometry(0.40, 0.46, 32);
      const pulseMat = new THREE.MeshBasicMaterial({
        color: 0x6ee7b7,
        transparent: true,
        opacity: 0.55,
        side: THREE.DoubleSide
      });
      const pulse = new THREE.Mesh(pulseGeo, pulseMat);
      pulse.rotation.x = -Math.PI / 2;
      pulse.userData.isPulse = true;
      hsGroup.add(pulse);

      // Center bright beacon
      const dotGeo = new THREE.CircleGeometry(0.08, 16);
      const dotMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide
      });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.rotation.x = -Math.PI / 2;
      hsGroup.add(dot);

      // 3D Billboard label sprite
      if (typeof document !== 'undefined' && typeof document.createElement === 'function') {
        try {
          const canvas = document.createElement('canvas');
          if (canvas && canvas.getContext) {
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(18, 30, 24, 0.90)';
            if (ctx.roundRect) ctx.roundRect(6, 6, 244, 52, 16); else ctx.rect(6, 6, 244, 52);
            ctx.fill();
            ctx.strokeStyle = '#34d399';
            ctx.lineWidth = 3.5;
            ctx.stroke();
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(info.label, 128, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.position.set(0, 0.48, 0);
            sprite.scale.set(1.4, 0.35, 1);
            hsGroup.add(sprite);
          }
        } catch (e) {}
      }

      // Hit proxy for reliable tapping
      const hitGeo = new THREE.CircleGeometry(0.70, 16);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });
      const hitProxy = new THREE.Mesh(hitGeo, hitMat);
      hitProxy.rotation.x = -Math.PI / 2;
      hitProxy.userData.isHotspot = true;
      hitProxy.userData.hotspotParent = hsGroup;
      hsGroup.add(hitProxy);

      hsGroup.userData.hotspotInfo = info;
      roomGroup.add(hsGroup);
      hotspotMeshes.push(hitProxy);
    }

    function buildRoomHotspots(room, w, d, h) {
      hotspotMeshes.length = 0;
      if (!room) return;
      const halfW = w * 0.5;
      const halfD = d * 0.5;

      // 1. Hotspot Tâm phòng
      createHotspotDisk({
        id: 'hs_center',
        label: '🏠 Giữa phòng',
        x: 0,
        z: 0,
        viewPos: new THREE.Vector3(0, 1.55, 0),
        viewLook: new THREE.Vector3(0, 1.15, halfD - 0.6)
      });

      const objs = room.objects || [];

      // 2. Hotspot Giường ngủ / Sofa
      const restObj = objs.find(o => o.kind === 'bed' || o.kind === 'sofa');
      if (restObj) {
        const rx = Math.max(-halfW + 0.6, Math.min(halfW - 0.6, (restObj.x || 0) + (restObj.x > 0 ? -1.0 : 1.0)));
        const rz = Math.max(-halfD + 0.6, Math.min(halfD - 0.6, (restObj.z || 0)));
        createHotspotDisk({
          id: 'hs_rest',
          label: '🛌 ' + restObj.label.slice(0, 14),
          x: rx,
          z: rz,
          viewPos: new THREE.Vector3(rx, 1.45, rz),
          viewLook: new THREE.Vector3(restObj.x, 0.8, restObj.z)
        });
      }

      // 3. Hotspot Bàn làm việc / Bàn học
      const workObj = objs.find(o => (o.kind === 'desk' || o.kind === 'table' || o.kind === 'shelf') && o !== restObj);
      if (workObj) {
        const wx = Math.max(-halfW + 0.6, Math.min(halfW - 0.6, (workObj.x || 0) + (workObj.x > 0 ? -0.9 : 0.9)));
        const wz = Math.max(-halfD + 0.6, Math.min(halfD - 0.6, (workObj.z || 0)));
        createHotspotDisk({
          id: 'hs_work',
          label: '🪑 ' + workObj.label.slice(0, 14),
          x: wx,
          z: wz,
          viewPos: new THREE.Vector3(wx, 1.45, wz),
          viewLook: new THREE.Vector3(workObj.x, 0.85, workObj.z)
        });
      }

      // 4. Hotspot Cửa ra vào
      const doorObj = objs.find(o => o.kind === 'door' || o.targetRoomId);
      const dx = doorObj ? Math.max(-halfW + 0.6, Math.min(halfW - 0.6, doorObj.x || 0)) : 0;
      const dz = doorObj ? (doorObj.z > 0 ? doorObj.z - 0.85 : doorObj.z + 0.85) : -halfD + 0.85;
      createHotspotDisk({
        id: 'hs_door',
        label: '🚪 Cửa vào',
        x: dx,
        z: Math.max(-halfD + 0.6, Math.min(halfD - 0.6, dz)),
        viewPos: new THREE.Vector3(dx, 1.55, Math.max(-halfD + 0.6, Math.min(halfD - 0.6, dz))),
        viewLook: new THREE.Vector3(0, 1.15, d * 0.15)
      });
    }

    window.moveToHotspot = function(hotspotId) {
      if (!roomGroup) return;
      const target = roomGroup.children.find(c => c.userData?.hotspotInfo?.id === hotspotId);
      if (target && target.userData?.hotspotInfo) {

    window.resetCameraOverview = function() {
      if (!roomGroup) return;
      isFocusedPov = false;
      activeFocusedFurniture = null;
      if (typeof clearFurnitureHighlight === 'function') clearFurnitureHighlight();
      if (navMode === 'fpv') {

        hint.style.display = 'block';

      // Reset any pulled out sub-books
      furnitureMeshes.forEach(f => {
        f.traverse(child => {
          if (child.userData?.isSubBook && child.userData.isPulledOut) {

      // Duy trì tính nhất quán về vị trí và hướng quan sát khi người dùng đóng một bảng nội dung
      const targetVantage = (lastStableVantage && lastStableVantage.pos && lastStableVantage.look)
        ? lastStableVantage
        : getInteriorViewpoint('doorway');

      animateCameraTo(targetVantage.pos, targetVantage.look, () => {

          controls.target.copy(targetVantage.look);
          controls.update();
        }
        window.ReactNativeWebView?.postMessage(JSON.stringify({ type: 'POV_STATE', mode: 'overview' }));
      });
    };

    let fpvGlideAnimId = null;
    function glidePlayerInFpv(targetPos, targetLook, onComplete) {
      if (typeof cancelAnimationFrame === 'function' && fpvGlideAnimId) cancelAnimationFrame(fpvGlideAnimId);
      const startPos = camera.position.clone();
      let targetYaw = fpvYaw;
      if (targetLook) {
        const dx = targetLook.x - targetPos.x;
        const dz = targetLook.z - targetPos.z;
        targetYaw = Math.atan2(-dx, -dz);
      }
      const startYaw = fpvYaw;
      let diffYaw = targetYaw - startYaw;
      while (diffYaw < -Math.PI) diffYaw += Math.PI * 2;
      while (diffYaw > Math.PI) diffYaw -= Math.PI * 2;

      const duration = 750;
      const getNow = () => (typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now());
      const startTime = getNow();
      let lastFootstepT = 0;

      function step() {
        const elapsed = getNow() - startTime;
        const t = Math.min(1, elapsed / duration);
        const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

        camera.position.x = startPos.x + (targetPos.x - startPos.x) * ease;
        camera.position.z = startPos.z + (targetPos.z - startPos.z) * ease;
        camera.position.y = PLAYER_HEIGHT;
        fpvYaw = startYaw + diffYaw * ease;
        fpvPitch = -0.06 * ease;

        camera.rotation.order = 'YXZ';
        camera.rotation.y = fpvYaw;
        camera.rotation.x = fpvPitch;
        camera.rotation.z = 0;

        if (t - lastFootstepT > 0.3) {
          lastFootstepT = t;
          playFootstepAudio();
        }

        render();

        if (t < 1 && typeof requestAnimationFrame === 'function') {
          fpvGlideAnimId = requestAnimationFrame(step);
        } else {
          fpvGlideAnimId = null;
          onComplete?.();
        }
      }
      step();
    }

    window.glideToFurniture = function(label) {
      if (!roomGroup || !label) return;
      const match = furnitureMeshes.find(g => {
        const info = g.userData?.furnitureInfo;
        return info && (info.label === label || info.id === label || info.kind === label);
      });
      if (!match) return;

      const info = match.userData?.furnitureInfo;
      highlightFurniture(match);

      if (navMode === 'fpv' && !isCameraLocked) {
        const fx = match.position.x;
        const fz = match.position.z;
        const fw = info?.width || 1.0;
        const fd = info?.depth || 1.0;
        const fy = match.position.y || 0;
        const fh = info?.height || 1.0;

        const rw = (roomGroup.userData.width || 6) / 2 - 0.45;
        const rd = (roomGroup.userData.depth || 6) / 2 - 0.45;

        let targetX = fx;
        let targetZ = fz;
        const toCenter = new THREE.Vector2(-fx, -fz).normalize();
        if (toCenter.length() > 0.1) {
          targetX += toCenter.x * Math.max(1.0, Math.max(fw, fd) * 0.85);
          targetZ += toCenter.y * Math.max(1.0, Math.max(fw, fd) * 0.85);
        } else {
          targetZ += 1.1;
        }
        targetX = Math.max(-rw, Math.min(rw, targetX));
        targetZ = Math.max(-rd, Math.min(rd, targetZ));

        const targetPos = new THREE.Vector3(targetX, PLAYER_HEIGHT, targetZ);
        const targetLook = new THREE.Vector3(fx, fy + Math.min(fh * 0.55, 1.2), fz);

        glidePlayerInFpv(targetPos, targetLook, () => {
          playInteractChime();
          if (info.kind === 'door' || info.targetRoomId || info.interaction?.type === 'door_transition') {
            window.ReactNativeWebView?.postMessage(JSON.stringify({
              type: 'DOOR_TRANSITION',
              targetRoomId: info.targetRoomId || info.interaction?.targetRoomId,
              label: info.label
            }));
          }
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            type: 'SELECT_FURNITURE',
            label: info.label,
            description: info.description,
            routineLabel: info.routineLabel,
            isInteractable: info.isInteractable !== false,
            item: info
          }));
        });
      } else {
        focusOnFurniture(match);
        if (info.kind === 'door' || info.targetRoomId || info.interaction?.type === 'door_transition') {
          window.ReactNativeWebView?.postMessage(JSON.stringify({
            type: 'DOOR_TRANSITION',
            targetRoomId: info.targetRoomId || info.interaction?.targetRoomId,
            label: info.label
          }));
        }
        window.ReactNativeWebView?.postMessage(JSON.stringify({
          type: 'SELECT_FURNITURE',
          label: info.label,
          description: info.description,
          routineLabel: info.routineLabel,
          isInteractable: info.isInteractable !== false,
          item: info
        }));
      }
    };

    window.strollStep = function(stepType) {
      if (navMode !== 'fpv') {
        window.setNavMode('fpv');
      }
      if (stepType === 'turn_left') {
        fpvYaw += (Math.PI / 6);
      } else if (stepType === 'turn_right') {
        fpvYaw -= (Math.PI / 6);
      } else if (stepType === 'forward') {
        const sinY = Math.sin(fpvYaw);
        const cosY = Math.cos(fpvYaw);
        const deltaX = -sinY * 0.85;
        const deltaZ = -cosY * 0.85;
        moveWithSlidewall(deltaX, deltaZ);
        playFootstepAudio();
      } else if (stepType === 'backward') {
        const sinY = Math.sin(fpvYaw);
        const cosY = Math.cos(fpvYaw);
        const deltaX = sinY * 0.65;
        const deltaZ = cosY * 0.65;
        moveWithSlidewall(deltaX, deltaZ);
        playFootstepAudio();
      }
      camera.rotation.order = 'YXZ';
      camera.rotation.y = fpvYaw;
      camera.rotation.x = fpvPitch;
      render();
    };

    window.focusFurnitureByLabel = function(label) {
      if (!roomGroup || !label) return;
      const match = furnitureMeshes.find(g => g.userData?.furnitureInfo?.label === label);
      if (match) {
        highlightFurniture(match);
        focusOnFurniture(match);
      }
    };

    function makeBox(parent, x, y, z, sx, sy, sz, mat, shadow = true) {
      if (!boxGeometry) boxGeometry = new THREE.BoxGeometry(1, 1, 1);

      mesh.scale.set(sx, sy, sz);
      mesh.position.set(x, y, z);

    function createCurvedBookPagesGeometry(spreadWidth, pageDepth, archHeight = 0.022) {
      const segsX = 28;
      const segsY = 8;
      const geo = new THREE.PlaneGeometry(spreadWidth, pageDepth, segsX, segsY);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const halfW = spreadWidth * 0.5;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const normX = x / halfW;
        let curveY = 0;
        if (normX < 0) {
          const u = normX + 1;
          curveY = Math.sin(u * Math.PI) * archHeight;
        } else {
          const u = 1 - normX;
          curveY = Math.sin(u * Math.PI) * archHeight;
        }
        const normZ = Math.abs(z / (pageDepth * 0.5));
        curveY += Math.pow(normZ, 2) * (archHeight * 0.12);
        pos.setY(i, curveY);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function disposeRoom() {
      if (typeof clearTimeout === 'function') { clearTimeout(highlightTimer); clearTimeout(bubbleTimer); }
      selectedGroup = null; hoveredObject = null;
      staticAABBs.length = 0;
      if (camAnimId !== null && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(camAnimId);
      camAnimId = null;
      clearPhotoTextures();
      if (!roomGroup) return;
      wallMeshes.length = 0;
      floorMesh = null;
      ceilingMesh = null;
      const materials = new Set();
      const textures = new Set();
      const geometries = new Set();
      roomGroup.traverse(child => {
        if (child.geometry) geometries.add(child.geometry);
        if (child.material) {
          materials.add(child.material);
          if (child.material.map) textures.add(child.material.map);
        }
      });
      geometries.forEach(g => g.dispose());
      boxGeometry = null;
      roomGroup.traverse(child => { if (child.isLight) child.dispose?.(); });
      materials.forEach(m => m.dispose());
      textures.forEach(t => t.dispose());
      scene.remove(roomGroup); roomGroup = null;
    }

    window.updateRoom = function(room) {
      const overlay = document.getElementById('empty-overlay');
      if (!room || !room.objects) {
        if (navMode === 'fpv') window.setNavMode('overview');

        wallMeshes.length = 0;
        if (overlay && overlay.style) overlay.style.display = 'flex';
        render(); return;
      }
      if (overlay && overlay.style) overlay.style.display = 'none';
      disposeRoom();
      furnitureMeshes.length = 0;
      wallMeshes.length = 0;

      roomGroup = new THREE.Group();

      const w = room.width || 6;

      // Lighting Physics: Thích ứng frustum đổ bóng theo diện tích phòng thực tế
      if (sun && sun.shadow && sun.shadow.camera) {
        const maxR = Math.max(w, d);

        sun.shadow.camera.right = maxR * 0.85;
        sun.shadow.camera.top = maxR * 0.85;
        sun.shadow.camera.bottom = -maxR * 0.85;
        sun.shadow.camera.near = 1.0;
        sun.shadow.camera.far = 45.0;
        sun.shadow.camera.updateProjectionMatrix();

      if (bounceLight && room.floorColor) {

      fitCameraToRoom();

      // SÀN NHÀ THEO PHONG CÁCH (VINTAGE TILES / WOOD PLANKS / SOLID TILES)

          floorTex.wrapT = THREE.RepeatWrapping;

      if (!floorMat) {

      // TƯỜNG VÔI ĐẶC (SOLID OPAQUE - 4 TƯỜNG ĐẦY ĐỦ KHÉP KÍN)

      const wallCanvas = generatePlasterWallCanvas(room.wallColor || '#DCE7E2');

      const trimMat = createMaterial('#F4EFE8', 0.8, 0.0);

      // Floor (child index 0)
      floorMesh = makeBox(roomGroup, 0, -0.1, 0, w, 0.2, d, floorMat, true);
      floorMesh.userData.surface = floorRegion || {
        surface_id: 'floor',

      // Back wall at +d/2 (child index 1)
      const backWall = makeBox(roomGroup, 0, h / 2, d / 2, w, h, 0.12, wallMat, true);
      currentBackWall = backWall;

      // Baseboards (child indices 3, 4)

      wallMeshes.push(backWall, leftWall);

      // CHẤT LIỆU GỖ MỘC
      const woodCanvas = generateWoodCanvas('#64462e');
      let woodMat;
      if (woodCanvas) {
        const woodTex = new THREE.CanvasTexture(woodCanvas);
        woodTex.wrapS = THREE.RepeatWrapping;
        woodTex.wrapT = THREE.RepeatWrapping;

      } else {
        woodMat = createMaterial('#795C45', 0.7, 0.1);
